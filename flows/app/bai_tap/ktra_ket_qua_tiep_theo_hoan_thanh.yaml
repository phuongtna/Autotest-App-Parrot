# HW-29 — Verify CTA màn "Kết quả bài tập" (id: exercise_result_screen):
#   Nhánh 1 "Tiếp theo": còn bài chưa hoàn thành -> CTA = "Tiếp theo" -> bấm THẬT (không dùng
#     workaround tap X) -> phải vào được 1 màn Doing mới (bài tiếp theo).
#   Nhánh 2 "Hoàn thành": hết bài chưa hoàn thành (bài vừa nộp là bài CUỐI) -> CTA đổi thành
#     "Hoàn thành" -> bấm THẬT -> phải quay về màn danh sách Bài tập (id: homework_screen).
#
# PHẠM VI (đã thống nhất 2026-08-22): case này CHỈ verify hành vi CTA/điều hướng của nút bấm - KHÔNG
# verify "Tiếp theo" có đưa đúng vào bài hạn nộp gần nhất hay không (verify identity đó cần biết
# nội dung câu hỏi từng bài - xem bản có verify identity + điểm số thật trong
# automation/bai_tap/setup-ktra_ket_qua_tiep_theo_hoan_thanh.mjs).
#
# SỬA (2026-09-08, yêu cầu rõ của user): bản CŨ giả định CỨNG "đúng 3 bài" (2 khối "Tiếp theo" cố
# định, current/near/far đặt tên riêng) - đây KHÔNG phải điều kiện thật của hành vi đang test (CTA
# chỉ phụ thuộc CÒN/HẾT bài chưa hoàn thành, không phụ thuộc số lượng cụ thể). Đã đổi sang
# `repeat.while` (CÙNG idiom "dừng khi hết điều kiện" đã dùng thật trong
# helpers/answer-current-exercise-generic.yaml) - lặp lại "Tiếp theo" -> trả lời -> đợi màn Kết quả
# CHO TỚI KHI CTA không còn "Tiếp theo" nữa, rồi mới assert nhánh "Hoàn thành". Tự chạy được với BẤT
# KỲ số bài chưa hoàn thành nào (1, 2, 5...) đang có sẵn trên profile, KHÔNG cần biết trước số lượng,
# KHÔNG cần đặt tên riêng cho "near"/"far" (dispatcher chung không cần biết tên bài để trả lời).
#
# CẦN GÌ ĐỂ CHẠY: chỉ cần ÍT NHẤT 1 bài tập ĐANG CÓ SẴN (KHÔNG cần mới/không cần giao thêm) chưa
# hoàn thành trên profile đang active - dùng làm điểm vào ("current", mở từ danh sách qua
# title+hạn nộp). Nếu profile đang active còn NHIỀU hơn 1 bài chưa hoàn thành, "Tiếp theo" sẽ tự
# đưa qua các bài còn lại - flow lặp cho tới khi CTA đổi thành "Hoàn thành".
#
# Tham số bắt buộc:
#   PHONE, OTP, PROFILE_NAME                      - tài khoản/hồ sơ cần active
#   EXERCISE_NAME_CURRENT / EXERCISE_DUE_DATE_DM_CURRENT  - bài mở TỪ DANH SÁCH (title+hạn nộp) -
#                                                    bất kỳ bài chưa hoàn thành nào ĐANG CÓ SẴN
#
# Nếu câu hỏi của bất kỳ bài nào trong chuỗi là SPEAK/SORT/SENTENCE_BUILDER: flow FAIL CÓ CHỦ ĐÍCH
# với "BLOCKED_MISSING_EXERCISE_HANDLER" (xem answer-current-exercise-generic.yaml) - không phải
# lỗi của chính flow này.
appId: ${APP_ID}
tags:
  - writes
  - regression
name: HW-29 Ket qua bai tap - CTA Tiep theo va Hoan thanh
---
# --- Đăng nhập + đảm bảo ĐÚNG hồ sơ ${PROFILE_NAME} đang active (tái sử dụng nguyên vẹn) ---
- runFlow:
    file: ../helpers/ensure-profile-active.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
      TARGET_PROFILE_NAME: ${PROFILE_NAME}

# ===================== Mở + hoàn thành "current" (giống ktra_fullluong_lambai.yaml) =====================
- runFlow:
    file: ../helpers/open-exercise.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
      EXERCISE_NAME: ${EXERCISE_NAME_CURRENT}
      EXERCISE_DUE_DATE_DM: ${EXERCISE_DUE_DATE_DM_CURRENT}
      DEVICE_MODE: "true"
- runFlow:
    file: ../helpers/answer-current-exercise-generic.yaml
    env:
      EXERCISE_NAME: ${EXERCISE_NAME_CURRENT}
- extendedWaitUntil:
    visible:
      id: "exercise_result_screen"
    timeout: 60000
- takeScreenshot: HW-29-result-after-current

# ===================== NHÁNH 1: CTA "Tiếp theo", lặp ĐỘNG cho tới khi hết bài chưa hoàn thành =====================
# KHÔNG giả định số lượng cố định (xem SỬA 2026-09-08 ở docblock đầu file) - lặp lại chuỗi
# "bấm Tiếp theo -> đợi màn Doing -> trả lời (dispatcher chung, không cần biết tên bài) -> đợi màn
# Kết quả" CHO TỚI KHI CTA không còn "Tiếp theo" nữa. "times: 25" chỉ là TRẦN an toàn (CÙNG idiom
# đã dùng trong helpers/answer-current-exercise-generic.yaml), không phải số lần thật sự cần chạy.
- repeat:
    while:
      visible:
        text: ".*(Tiếp theo).*"
    times: 25
    commands:
      - assertNotVisible:
          text: ".*(Hoàn thành).*"
      # Bấm THẬT "Tiếp theo" - KHÔNG dùng workaround tap "exercise_result_close_button" (X).
      - tapOn:
          text: ".*(Tiếp theo).*"
      - extendedWaitUntil:
          visible:
            id: "exercise_close_button"
          timeout: 30000
      - takeScreenshot: HW-29-landed-after-tieptheo
      - runFlow:
          file: ../helpers/answer-current-exercise-generic.yaml
      - extendedWaitUntil:
          visible:
            id: "exercise_result_screen"
          timeout: 60000
      - takeScreenshot: HW-29-result-after-tieptheo

# ===================== NHÁNH 2: CTA "Hoàn thành" (hết bài chưa hoàn thành) =====================
- assertVisible:
    text: ".*(Hoàn thành).*"
- assertNotVisible:
    text: ".*(Tiếp theo).*"

# Bấm THẬT "Hoàn thành" - phải quay về đúng màn danh sách Bài tập.
- tapOn:
    text: ".*(Hoàn thành).*"
- extendedWaitUntil:
    visible:
      id: "homework_screen"
    timeout: 30000
- takeScreenshot: HW-29-back-to-list-after-hoanthanh
