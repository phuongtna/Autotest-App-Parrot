# (và trước đó là `scrollUntilVisible`) ĐÃ CHỨNG MINH bị đánh lừa bởi card trùng title+Hạn nộp khi
# danh sách dài - xem 6 lần "fix" liên tiếp trong lịch sử comment bên dưới (không lần nào chạm root
