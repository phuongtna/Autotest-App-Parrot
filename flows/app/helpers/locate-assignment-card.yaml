# thật (~42-83 card ước tính) rất nhiều. Root cause: swipe 65% màn hình/400ms là gesture NHANH (gần
# như vuốt hất - "fling"), tạo qu án tính cuộn tiếp tục (momentum) SAU KHI lệnh swipe đã "COMPLETED"
# - lặp lại 70 lần LIÊN TỤC không có bước chờ ổn định giữa 2 lượt khiến quán tính CỘNG DỒN, mỗi lượt
# đi xa hơn nhiều so với tính toán ban đầu (2-3 card/lượt) - đủ để vượt qua TOÀN BỘ danh sách + phần
# nội dung KHÁC nằm sau nó chỉ trong vài chục lượt. SỬA: đổi sang ĐÚNG biên độ/tốc độ đã verify thật
# trong flows/bai_tap/ktra_fullluong_lambai.yaml (dòng "cuộn về đầu danh sách", swipe 50% màn
# hình/600ms - CHẬM hơn, biên độ nhỏ hơn hẳn bản lần 4, giảm hẳn quán tính) + thêm
# `waitForAnimationToEnd` (idiom đã dùng khắp repo, vd flows/helpers/answer-current-exercise-generic.yaml)
# SAU mỗi swipe để đảm bảo list đã đứng yên hẳn TRƯỚC KHI `repeat.while` đọc lại hierarchy cho lượt
# kiểm tra kế tiếp - không còn đọc hierarchy giữa lúc còn đang trôi theo quán tính. Tăng `times` lên
# 100 (bù lại vì mỗi lượt giờ đi được ÍT khoảng cách hơn, cần nhiều lượt hơn để tới cùng độ sâu).
#
# ĐÃ SỬA LẦN 6 (2026-08-19, cùng ngày - lần 5 tự gây lỗi KHÁC, KHÁC hẳn lần 4): chạy thật lại, vòng
# lặp DỪNG ĐÚNG lúc (17 lượt, không tràn 100, không overscroll như lần 4) NHƯNG `assertVisible` vẫn
# FAILED - screenshot debug (step-053) xác nhận: title "G3-U3-Lesson 1: Listen and choose" chỉ vừa
# HÉ MÉP DƯỚI cùng màn hình (đúng dòng cuối, cắt ngay dưới chữ), toàn bộ "0/M", "Hạn nộp", nút "Làm
# bài" của card đó CÒN NẰM NGOÀI khung nhìn phía dưới - `notVisible: {text: TARGET_TITLE}` coi
# title "đã visible" ngay khi nó VỪA hé ra (đúng hành vi Maestro - "visible" nghĩa là tồn tại trong
# cây view + có bounds giao với màn hình, KHÔNG yêu cầu hiện đầy đủ), nên `repeat.while` dừng cuộn
# NGAY LÚC ĐÓ - SỚM HƠN 1 nhịp so với lúc "Hạn nộp" của ĐÚNG card đó kịp lọt vào khung nhìn. Đây
# CHÍNH XÁC là lỗi "scrollUntilVisible dừng sớm khi title mới hé mép" đã ghi nhận trước đó ở
# flows/bai_tap/ktra_fullluong_lambai.yaml (dòng 223-232, đoạn "BẢN ĐÚNG: dùng compound selector") -
# SỬA cùng cách: đổi ĐIỀU KIỆN DỪNG của vòng lặp từ "title visible" sang ĐÚNG compound selector mà
# bước assertVisible bên dưới cần ("Hạn nộp DATE" hiện NGAY DƯỚI title) - vòng lặp giờ chỉ dừng khi
# CẢ 2 cùng lọt vào khung nhìn đồng thời, không dừng non khi chỉ title vừa hé. assertVisible bên
# dưới giữ NGUYÊN (giờ gần như luôn pass ngay vì điều kiện đã được xác nhận ngay trong vòng lặp) -
# giữ lại làm safety-check cuối, không đổi ý nghĩa/business rule.
- repeat:
    while:
      notVisible:
        text: "Hạn nộp ${TARGET_DUE_DATE_DM}"
        below:
          text: "${TARGET_TITLE}"
    times: 100
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 35%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 800

- assertVisible:
    text: "Hạn nộp ${TARGET_DUE_DATE_DM}"
    below:
      text: "${TARGET_TITLE}"
