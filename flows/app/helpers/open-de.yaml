# Helper: mở 1 đề ("Đề thầy cô giao") và dừng lại ở màn LÀM BÀI (cùng màn
# app/dashboard/exercise/doing.tsx đã dùng cho module Bài tập - spec.json không nói có màn riêng
# cho on_thi, và câu hỏi dùng chung testID exercise_* theo mọi ghi chú module đã biết trong repo).
#
# NHÁI LẠI ĐÚNG kỹ thuật đã verify thật trong `flows/app/helpers/open-exercise.yaml` (escape regex
# ký tự đặc biệt trong tên đề, due-date làm anchor VERIFY không phải SCROLL TARGET, tapOn CTA lồng
# "below" 2 cấp title->Hạn nộp để né lỗi tap-nhầm-card-trùng-lặp) - mở tab "Ôn thi > Đề thầy cô
# giao" (thay vì "Bài tập") + CTA regex "(Làm bài|Làm tiếp|Làm lại)".
#
# ĐÃ VERIFY THẬT (2026-10-28, thiết bị 3201d866d40a1681 model SM-M205G, app com.inet.parrotedu, tài
# khoản/profile "Phương" lớp 11A2): card CHƯA nộp dùng "Làm bài" (resource-id
# exam_prep_assignment_<id>_action_none), card ĐÃ nộp dùng "Làm lại" (resource-id
# exam_prep_assignment_<id>_action_done) - CẢ 2 ĐỀU LÀ NÚT "mở 1 lượt làm bài MỚI" (khác "Xem bài đã
# làm"/_review, dẫn vào màn lịch sử read-only, KHÔNG mở lượt làm mới). "Làm tiếp" (đang làm dở) CHƯA
# quan sát được thật trên tài khoản này (chưa có đề nào đang dở dang tại thời điểm test) - giữ trong
# regex vì đã có trong ảnh mockup gốc, nhưng CHƯA tự verify text/id riêng.
#
# Tham số: PHONE, OTP, DE_NAME (mặc định dùng tên đặt chỗ, LUÔN truyền thật khi chạy có ý nghĩa),
# DE_DUE_DATE_DM (optional, "DD/MM" - dùng khi DE_NAME có thể trùng ≥2 card), ON_THI_TAB (optional,
# mặc định "Đề thầy cô giao" - truyền "Kho đề Parrot" để mở đề từ tab kia, xem
# open-tab-on-thi.yaml - THÊM MỚI 2026-10-30, cùng đợt viết `onThiExamEngine.js`).
#
# DEVICE_MODE=true -> bỏ qua launchApp + login (xem open-exercise.yaml để biết lý do đầy đủ).
#
# CHƯA VERIFY HẾT TRÊN THIẾT BỊ THẬT - đã verify nhánh "Làm bài"/"Làm lại" (trên), CHƯA verify
# nhánh EXERCISE_DUE_DATE_DM (due-date làm anchor lồng 2 cấp) + bottom sheet nâng cấp Pro/Free (xem
# ghi chú CẦN XÁC MINH ở automation/on_thi/navigation/onThiPageObjects.js).
#
# MÀN "Thông tin đề" TRUNG GIAN (THÊM MỚI 2026-10-30, phát hiện qua thao tác tay `adb shell input
# tap` cùng phiên viết `onThiExamEngine.js` - xem TestCase_PAR-3172_OnThi_LamBai.xlsx): tap CTA
# "Làm bài"/"Làm tiếp"/"Làm lại" trên card ở danh sách KHÔNG vào thẳng màn Doing - dừng lại ở màn
# "Thông tin đề" (hiển thị Thời lượng tối đa/Tổng số câu/Cấu trúc đề/Lịch sử làm bài), cần bấm thêm
# "Bắt đầu làm bài" rồi xác nhận popup "Bắt đầu làm bài?" ("Bắt đầu"/"Để sau") mới thật sự vào màn
# Doing. CHƯA chắc chắn 100% MỌI trường hợp đều qua màn trung gian này (vd "Làm tiếp" một lượt đang
# dở CÓ THỂ vào thẳng Doing, KHÔNG qua lại Info - chưa tự verify nhánh đó) - xử lý BEST-EFFORT
# (`when: visible`) bên dưới, không throw nếu không thấy màn Info (coi như đã vào thẳng Doing).
appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${DEVICE_MODE != 'true'}
    commands:
      - runFlow: launch-keep-session.yaml
      - runFlow:
          file: login.yaml
          env:
            PHONE: ${PHONE}
            OTP: ${OTP}
- runFlow:
    when:
      true: ${DEVICE_MODE == 'true'}
    commands:
      - tapOn:
          id: "exercise_close_button"
          optional: true
      - tapOn:
          id: "exercise_show_answer_next_button"
          optional: true
      - tapOn:
          text: ".*(Hoàn thành|Đóng).*"
          optional: true

- runFlow:
    file: open-tab-on-thi.yaml
    env:
      ON_THI_TAB: ${ON_THI_TAB}

#
# SỬA LẠI HẲN CÁCH CUỘN SAU KHI CHẠY THẬT (2026-11-04, `maestro test` thật - `scrollUntilVisible`
# FAIL 4/4 lần liên tiếp, kể cả sau 2 lần vá bằng wait/scroll-lại): TÁI SỬ DỤNG đúng kỹ thuật cuối
# cùng (sau 6 lần sửa) đã ổn định thật cho module Bài tập - xem lịch sử đầy đủ trong docblock
# `flows/app/helpers/locate-assignment-card.yaml` (file đã deprecated nhưng GIỮ LẠI đúng cho mục
# đích đối chiếu công thức này). Root cause giống hệt: `scrollUntilVisible` coi Tên đề "đã visible"
# NGAY KHI nó vừa hé mép dưới màn hình (đúng định nghĩa "visible" của Maestro - có bounds giao màn
# hình, KHÔNG cần hiện đầy đủ), trong khi nút CTA "Làm bài/Làm tiếp/Làm lại" nằm NGAY SAU title vẫn
# còn ngoài khung nhìn phía dưới -> dừng cuộn SỚM 1 nhịp, `tapOn...below` ngay sau đó luôn
# "Element not found" dù title đúng thật đang "visible" theo Maestro. SỬA: bỏ hẳn `scrollUntilVisible`,
# dùng `repeat.while` + `swipe` thô với ĐIỀU KIỆN DỪNG = ĐÚNG compound selector mà bước `tapOn` cần
# (CTA below title/due-date), không phải chỉ "title visible" - vòng lặp chỉ dừng khi cả 2 phần tử đã
# cùng lọt khung nhìn. `waitForAnimationToEnd` sau mỗi swipe để triệt tiêu quán tính trước khi đọc
# lại hierarchy cho lượt kiểm tra kế - không đọc lúc còn đang trôi. Biên độ/tốc độ swipe + `times`
# COPY NGUYÊN giá trị cuối cùng đã verify ổn định ở `locate-assignment-card.yaml` (bản sửa lần 5/6),
# KHÔNG tự chế số mới.
- runFlow:
    when:
      true: ${DE_DUE_DATE_DM != null && DE_DUE_DATE_DM != 'undefined'}
    commands:
      - repeat:
          while:
            notVisible:
              text: ".*(Làm bài|Làm tiếp|Làm lại).*"
              below:
                text: ".*Hạn nộp ${DE_DUE_DATE_DM}.*"
                below:
                  text: '.*${(DE_NAME == null ? "Đề kiểm tra" : DE_NAME).replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
          times: 100
          commands:
            - swipe:
                start: 50%, 85%
                end: 50%, 35%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 800
      - assertVisible:
          text: ".*Hạn nộp ${DE_DUE_DATE_DM}.*"
          below:
            text: '.*${(DE_NAME == null ? "Đề kiểm tra" : DE_NAME).replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - tapOn:
          text: ".*(Làm bài|Làm tiếp|Làm lại).*"
          below:
            text: ".*Hạn nộp ${DE_DUE_DATE_DM}.*"
            below:
              text: '.*${(DE_NAME == null ? "Đề kiểm tra" : DE_NAME).replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
- runFlow:
    when:
      true: ${DE_DUE_DATE_DM == null || DE_DUE_DATE_DM == 'undefined'}
    commands:
      # Xem ghi chú "SỬA LẠI HẲN CÁCH CUỘN" ở nhánh DE_DUE_DATE_DM phía trên (cùng file) - cùng 1 bug,
      # cùng 1 cách sửa, chỉ khác điều kiện dừng (không có "Hạn nộp" để neo nên dừng thẳng ở CTA).
      - repeat:
          while:
            notVisible:
              text: ".*(Làm bài|Làm tiếp|Làm lại).*"
              below:
                text: '.*${(DE_NAME == null ? "Đề kiểm tra" : DE_NAME).replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
          times: 100
          commands:
            - swipe:
                start: 50%, 85%
                end: 50%, 35%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 800
      - tapOn:
          text: ".*(Làm bài|Làm tiếp|Làm lại).*"
          below:
            text: '.*${(DE_NAME == null ? "Đề kiểm tra" : DE_NAME).replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'

# Bottom sheet nâng cấp Pro/Free (spec.json mục "Rule quyền truy cập theo gói"): nếu tài khoản Free
# bấm vào đề Pro, app KHÔNG vào màn làm bài mà hiện sheet nâng cấp - helper này KHÔNG dismiss sheet
# đó (khác AI-consent bên dưới), để nguyên cho caller tự assert (xem TEST-CASES.md nhóm III) - CHƯA
# có copy thật để biết chọn selector nào (xem onThiPageObjects.js#upgradeSheet).

# Màn "Thông tin đề" trung gian (xem ghi chú đầu file) - best-effort, bỏ qua nếu đã vào thẳng Doing.
#
# STOP_AT_INFO_SCREEN (optional, mặc định "false" - THÊM MỚI 2026-11-04 phục vụ bộ test case
# `flows/app/on_thi/CD-*.yaml` chuyển thể từ "Ôn thi-Chi tiết đề.xlsx"): truyền "true" để DỪNG LẠI
# ngay tại màn "Thông tin đề" (KHÔNG tự bấm "Bắt đầu làm bài"/"Bắt đầu") - phần lớn test case của
# bộ Chi tiết đề cần assert chính màn này (Tên đề/Thời lượng/Cấu trúc đề/nút action/popup xác nhận)
# TRƯỚC khi vào màn Doing, khác với `open-de.yaml` mặc định (luôn đi thẳng tới màn Doing cho các
# flow làm-bài-đầy-đủ như OT-34_35).
- runFlow:
    when:
      true: ${STOP_AT_INFO_SCREEN != 'true'}
    commands:
      - runFlow:
          when:
            visible: "Bắt đầu làm bài"
          commands:
            - tapOn: "Bắt đầu làm bài"
            - runFlow:
                when:
                  visible: "Bắt đầu làm bài?"
                commands:
                  - tapOn: "Bắt đầu"

# Consent AI nếu tài khoản chưa đồng ý - CÙNG dialog chung toàn app, không riêng module nào. BỎ QUA
# khi STOP_AT_INFO_SCREEN=true (dialog này chỉ xuất hiện ở màn Doing, chưa chắc đã gặp ở màn Info).
- runFlow:
    when:
      true: ${STOP_AT_INFO_SCREEN != 'true'}
    commands:
      - runFlow:
          when:
            visible: ".*(AI hỗ trợ học tập).*"
          commands:
            - tapOn: ".*(Tiếp tục).*"

# Chốt (STOP_AT_INFO_SCREEN != true - mặc định): đã vào màn làm bài.
#
# SỬA LẠI SAU KHI CHẠY THẬT (2026-11-04, thiết bị 3201d866d40a1681, đề "Đề kiểm tra giữa kỳ 1 -
# Khối 6 sửa 12"): claim cũ "màn Doing dùng chung đúng id exercise_close_button với module Bài tập"
# SAI cho phần KHUNG BỌC NGOÀI - `maestro hierarchy` thật cho thấy khung Doing của Ôn thi dùng bộ id
# RIÊNG `exam_prep_doing_*` (root `exam_prep_doing_screen`, không có `exercise_close_button` nào cả)
# - chỉ phần NỘI DUNG câu hỏi bên trong (`exercise_question_header`/`exercise_answer_N`) mới thật sự
# dùng chung id `exercise_*` như docblock `onThiExamEngine.js` mô tả. Đổi marker chốt sang
# `exam_prep_doing_screen` (ĐÃ XÁC NHẬN THẬT) - xem thêm các id RIÊNG khác đã xác nhận cùng lượt này
# trong `onThiPageObjects.js#doing` (exitIconId/markForReviewIconId/toolbarSubmitButtonId/
# questionListButtonId/ctaButtonId/timerId).
- runFlow:
    when:
      true: ${STOP_AT_INFO_SCREEN != 'true'}
    commands:
      - extendedWaitUntil:
          visible:
            id: "exam_prep_doing_screen"
          timeout: 40000
      - extendedWaitUntil:
          visible:
            text: ".*(Kiểm tra|Tiếp theo|Tiếp tục|Nhấn để nói|Nhập câu trả lời).*"
          timeout: 90000
          optional: true
      - extendedWaitUntil:
          visible:
            id: "exercise_connect_left_0"
          timeout: 90000
          optional: true

# Chốt (STOP_AT_INFO_SCREEN == true): xác nhận đang dừng ĐÚNG ở màn "Thông tin đề" - best-effort,
# KHÔNG throw nếu app lỡ đi thẳng vào Doing (vài nhánh "Làm tiếp" CHƯA chắc chắn luôn qua lại màn
# Info, xem ghi chú đầu file), để caller tự assert tiếp tuỳ ngữ cảnh case.
- runFlow:
    when:
      true: ${STOP_AT_INFO_SCREEN == 'true'}
    commands:
      - extendedWaitUntil:
          visible:
            text: ".*(Bắt đầu làm bài|Tiếp tục làm bài).*"
          timeout: 20000
          optional: true
