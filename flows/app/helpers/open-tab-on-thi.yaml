# Helper: mở tab "Ôn thi" > sub-tab ${ON_THI_TAB} ("Đề thầy cô giao" MẶC ĐỊNH, hoặc "Kho đề
# Parrot" nếu truyền ON_THI_TAB="Kho đề Parrot") và chờ danh sách render xong.
#
# SỬA LẠI SAU KHI CHẠY THẬT QUA `maestro test` LẦN ĐẦU (2026-11-04, thiết bị 3201d866d40a1681, app
# com.inet.parrotedu, tài khoản 84987652170/profile Duy lớp 3C): claim cũ "'Ôn thi' là 1 tab điều
# hướng trực tiếp bằng text" SAI - "Ôn thi" KHÔNG phải bottom tab (bottom tab bar thật chỉ có đúng 4
# mục, resource-id tab_happy_learning/tab_homework/tab_chat/tab_report, xác nhận qua
# `maestro hierarchy` lẫn 2 profile Duy và Hoang Gia Minh). "Ôn thi" là 1 ô quick-nav NẰM BÊN TRONG
# nội dung tab "Báo cáo" (id tab_report), và CẦN CUỘN XUỐNG mới thấy (ở dưới card báo cáo, không
# nằm ngay đầu màn) - xác nhận qua `scrollUntilVisible` + `maestro hierarchy` thật. Vì vậy helper
# này giờ LUÔN chủ động mở "Báo cáo" trước (không phụ thuộc app đang ở tab nào sau
# launch-keep-session.yaml/login.yaml), bỏ qua bước này nếu đã đang ở sẵn màn danh sách đề (idempotent).
appId: ${APP_ID}
---
- runFlow:
    when:
      notVisible:
        text: ".*(Đề thầy cô giao|Kho đề Parrot).*"
    commands:
      - tapOn:
          id: "tab_report"
      - extendedWaitUntil:
          visible:
            text: ".*(Báo cáo học tập).*"
          timeout: 15000
      - scrollUntilVisible:
          element:
            text: "Ôn thi"
          direction: DOWN
          timeout: 20000
          speed: 50
      - tapOn: "Ôn thi"

- runFlow:
    when:
      true: ${DEVICE_MODE == 'true'}
    commands:
      - repeat:
          times: 5
          commands:
            - swipe:
                direction: DOWN
                duration: 250

# Chọn ĐÚNG sub-tab mong muốn (mặc định "Đề thầy cô giao" nếu không truyền ON_THI_TAB) - tap lại
# cho idempotent, không gây lỗi nếu đã đang chọn sẵn.
- tapOn:
    text: "${ON_THI_TAB == null || ON_THI_TAB == 'undefined' ? 'Đề thầy cô giao' : ON_THI_TAB}"

- extendedWaitUntil:
    visible:
      # CẦN XÁC MINH text rỗng-danh-sách thật ("Bạn chưa có đề nào..." hay tương tự) - để trống
      # trong cụm OR bên dưới cho tới khi capture được, tạm chấp nhận filter label làm tín hiệu
      # "màn đã load xong" (luôn có mặt theo spec.json kể cả khi danh sách rỗng - "0 đề"). "N đề"
      # (ĐÃ XÁC NHẬN THẬT - nhãn "3 đề"/"4 đề") thêm vào cụm OR cho cả 2 sub-tab.
      text: ".*(Đề thầy cô giao|Kho đề Parrot|\\d+ đề|2 tuần gần nhất|1 tháng gần nhất).*"
    timeout: 30000
