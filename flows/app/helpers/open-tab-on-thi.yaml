# Helper: mở tab "Ôn thi" > sub-tab ${ON_THI_TAB} ("Đề thầy cô giao" MẶC ĐỊNH, hoặc "Kho đề
# Parrot" nếu truyền ON_THI_TAB="Kho đề Parrot") và chờ danh sách render xong.
#
# ĐÃ XÁC NHẬN THẬT (2026-10-30, thao tác tay qua `adb shell input tap` + screenshot, thiết bị
# 3201d866d40a1681, app com.inet.parrotedu, tài khoản/profile "Phương" lớp 11A2): "Ôn thi" ĐÚNG LÀ
# 1 tab điều hướng được bằng text trực tiếp (không cần mở từ "Vui học"/banner nào khác), và màn
# Danh sách đề CÓ ĐÚNG 2 sub-tab "Đề thầy cô giao"/"Kho đề Parrot" như ảnh mockup gốc - xoá cảnh báo
# "CẦN XÁC MINH tên tab gốc" trước đây. CHƯA chạy qua `maestro test`/MaestroBridge thật lần nào
# (toàn bộ xác nhận trên đến từ `adb shell input tap` thô, không phải qua chính file YAML này) -
# tham số hoá ON_THI_TAB thêm MỚI (2026-10-30) để tái sử dụng helper này cho cả 2 tab khi viết
# `onThiExamEngine.js`, CHƯA tự chạy thử nhánh "Kho đề Parrot" qua Maestro.
appId: ${APP_ID}
---
- tapOn:
    text: "Ôn thi"

- runFlow:
    when:
      true: ${DEVICE_MODE == 'true'}
    commands:
      - repeat:
          times: 5
          commands:
            - swipe:
                direction: DOWN
                duration: 250

# Chọn ĐÚNG sub-tab mong muốn (mặc định "Đề thầy cô giao" nếu không truyền ON_THI_TAB) - tap lại
# cho idempotent, không gây lỗi nếu đã đang chọn sẵn.
- tapOn:
    text: ${ON_THI_TAB == null || ON_THI_TAB == 'undefined' ? 'Đề thầy cô giao' : ON_THI_TAB}

- extendedWaitUntil:
    visible:
      # CẦN XÁC MINH text rỗng-danh-sách thật ("Bạn chưa có đề nào..." hay tương tự) - để trống
      # trong cụm OR bên dưới cho tới khi capture được, tạm chấp nhận filter label làm tín hiệu
      # "màn đã load xong" (luôn có mặt theo spec.json kể cả khi danh sách rỗng - "0 đề"). "N đề"
      # (ĐÃ XÁC NHẬN THẬT - nhãn "3 đề"/"4 đề") thêm vào cụm OR cho cả 2 sub-tab.
      text: ".*(Đề thầy cô giao|Kho đề Parrot|\\d+ đề|2 tuần gần nhất|1 tháng gần nhất).*"
    timeout: 30000
