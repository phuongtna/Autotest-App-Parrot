# Testcase: Đăng nhập thành công với số điện thoại + OTP hợp lệ.
# Số điện thoại/OTP lấy từ test_data/datatest.js (nạp bằng runScript, dùng qua ${output.PHONE}/${output.OTP}).
#
# Chạy: maestro test flows/login/login_success_valid_otp.yaml -e APP_ID=com.inet.parrotedu
appId: ${APP_ID}
---
- runFlow: ../subflows/launch_app.yaml
- runScript: ../../test_data/datatest.js

# Bước 1: màn hình đăng nhập - nhập số điện thoại
- assertVisible: "Vui lòng đăng nhập để tiếp tục"
- tapOn: "Nhập số điện thoại"
- inputText: ${output.PHONE}
- tapOn: "Đăng nhập"

# Bước 2: màn hình xác thực OTP - ô nhập là 1 vùng ẩn nằm ngay dưới link "Đổi số điện thoại"
- extendedWaitUntil:
    visible:
      text: "Xác thực OTP"
    timeout: 10000
- tapOn:
    below: "Đổi số điện thoại"
    above: "Xác nhận"
- inputText: ${output.OTP}
- tapOn: "Xác nhận"

# Kiểm tra đăng nhập thành công - vào màn hình chính có tab "Vui học"
- extendedWaitUntil:
    visible:
      text: "Vui học"
    timeout: 15000
- takeScreenshot: login_success
