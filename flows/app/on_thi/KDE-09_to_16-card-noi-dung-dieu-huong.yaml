# KDE-09_to_16 — Card đề trong danh sách: nội dung hiển thị, điều hướng, đồng bộ trạng thái Công
# khai/Xóa trên CMS (màn Danh sách đề, tab "Kho đề Parrot")
#
# Nguồn: "Ôn thi-Kho đề.xlsx" (TC_PAR_DSDE_9..16, Jira PAR-3170) - QA ĐÃ CHẠY THẬT và Pass.
#
# KHÔNG tự động hoá TC_14 (đề đang làm dở bị CMS chuyển Chưa công khai NGAY GIỮA LÚC đang làm) -
# cần Node orchestrator phối hợp App (đang mid-exam) + Web/CMS (unpublish xen giữa) trong CÙNG 1
# kịch bản, cùng lý do đã ghi nhận ở TEST-CASES.md (module Đề thầy cô giao) Ghi chú #3 cho
# OT-20/21/22 - CHƯA đọc `flows/web/giao_bai_tap/giao_de_luyen_tap/`/`automation/ngan_hang_de_thi/`
# để biết có sẵn thao tác "Ẩn đề" dạng code hay chỉ qua UI thủ công, cần làm trước khi viết case này.
#
# Tham số (TẤT CẢ OPTIONAL, mỗi khối chỉ chạy khi đủ tham số):
#   PHONE, OTP
#   DE_NAME_NEWEST, DE_NAME_OLDEST — TC_9: 2 đề công khai đã biết thứ tự tạo (NEWEST tạo SAU,
#     OLDEST tạo TRƯỚC) - chỉ là BẰNG CHỨNG YẾU (xem comment tại chỗ dùng), không quét toàn bộ
#     danh sách để đếm vị trí chính xác.
#   DE_NAME_CONTENT_CHECK, EXAM_TYPE_BADGE, DURATION_MIN, TOTAL_QUESTIONS — TC_10: 1 đề CHƯA từng
#     làm, biết trước cấu hình CMS (vd "Thi vào 10"/"90"/"40").
#   DE_NAME_PRO — TC_11: 1 đề đã gắn Pro trên CMS.
#   DE_NAME_FREE — TC_12: 1 đề Free (không gắn Pro).
#   DE_NAME_UNPUBLISHED — TC_13: 1 đề đang "Chưa công khai" trên CMS (QA tự set up thủ công trước).
#   DE_NAME_CMS_DELETED — TC_15: 1 đề VỪA bị xóa hẳn trên CMS (QA tự xóa thủ công trước khi chạy
#     khối này - chỉ verify phía App KHÔNG còn card, KHÔNG tự verify được phần "mất lịch sử làm bài"
#     bằng 1 assertion đơn giản, QA đối chiếu thêm bằng mắt ở màn Lịch sử làm bài nếu cần).
#   DE_NAME_NAV — TC_16: 1 đề BẤT KỲ đang hiển thị trong danh sách, dùng để test tap-card điều hướng.
#
# CHƯA VERIFY TRÊN THIẾT BỊ THẬT bằng Maestro.
appId: ${APP_ID}
tags:
  - regression
  - data-dependent
name: KDE-09_to_16 Card de noi dung va dieu huong
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow:
    file: ../helpers/open-tab-on-thi.yaml
    env:
      ON_THI_TAB: "Kho đề Parrot"

# --- TC_9: thứ tự mới nhất lên đầu - BẰNG CHỨNG YẾU (chỉ xác nhận NEWEST hiện không cần cuộn,
# OLDEST cần cuộn mới thấy), KHÔNG đếm chính xác vị trí từng card ---
- runFlow:
    when:
      true: ${DE_NAME_NEWEST != null && DE_NAME_NEWEST != 'undefined' && DE_NAME_NEWEST != '' && DE_NAME_OLDEST != null && DE_NAME_OLDEST != 'undefined' && DE_NAME_OLDEST != ''}
    commands:
      - assertVisible:
          text: '.*${DE_NAME_NEWEST.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - takeScreenshot: artifacts/KDE-09-newest-dau-danh-sach
      - scrollUntilVisible:
          element:
            text: '.*${DE_NAME_OLDEST.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
          direction: DOWN
          timeout: 60000
          speed: 70
          waitToSettleTimeoutMs: 500
      - takeScreenshot: artifacts/KDE-09-oldest-can-cuon-moi-thay
      - scrollUntilVisible:
          element:
            text: '.*${DE_NAME_NEWEST.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
          direction: UP
          timeout: 60000
          speed: 70

# --- TC_10: Card đủ Loại kỳ thi/Tên đề/Thời lượng/Tổng số câu, KHÔNG có badge Pro/trạng thái (chưa
# làm lần nào) ---
- runFlow:
    when:
      true: ${DE_NAME_CONTENT_CHECK != null && DE_NAME_CONTENT_CHECK != 'undefined' && DE_NAME_CONTENT_CHECK != ''}
    commands:
      - scrollUntilVisible:
          element:
            text: '.*${DE_NAME_CONTENT_CHECK.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
          direction: DOWN
          timeout: 60000
          speed: 70
          waitToSettleTimeoutMs: 500
      - runFlow:
          when:
            true: ${EXAM_TYPE_BADGE != null && EXAM_TYPE_BADGE != 'undefined' && EXAM_TYPE_BADGE != ''}
          commands:
            - assertVisible:
                text: ${EXAM_TYPE_BADGE}
                above:
                  text: '.*${DE_NAME_CONTENT_CHECK.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      # SỬA LẠI SAU KHI CHẠY THẬT (2026-11-19, FAIL THẬT): "N phút" và "M câu" KHÔNG phải 2 text
      # node tách rời - thật ra là 1 CHUỖI GỘP DUY NHẤT "N phút - M câu" trên CÙNG 1 node (xem
      # onThiPageObjects.js#khoDeParrot.list) - selector Maestro match theo FULL text của node (không
      # phải substring), nên assert riêng "2 phút" trên node có full text "2 phút - 20 câu" luôn FAIL
      # dù đúng dữ liệu. Gộp lại thành 1 assertion khớp CẢ chuỗi.
      - runFlow:
          when:
            true: ${DURATION_MIN != null && DURATION_MIN != 'undefined' && DURATION_MIN != '' && TOTAL_QUESTIONS != null && TOTAL_QUESTIONS != 'undefined' && TOTAL_QUESTIONS != ''}
          commands:
            - assertVisible:
                text: "${DURATION_MIN} phút - ${TOTAL_QUESTIONS} câu"
                below:
                  text: '.*${DE_NAME_CONTENT_CHECK.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - assertNotVisible:
          text: "Pro"
          below:
            text: '.*${DE_NAME_CONTENT_CHECK.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - assertNotVisible:
          text: ".*(Đang làm dở|Đã hoàn thành).*"
          below:
            text: '.*${DE_NAME_CONTENT_CHECK.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - takeScreenshot: artifacts/KDE-10-card-du-noi-dung

# --- TC_11: đề gắn Pro -> hiển thị badge "Pro" ---
- runFlow:
    when:
      true: ${DE_NAME_PRO != null && DE_NAME_PRO != 'undefined' && DE_NAME_PRO != ''}
    commands:
      - scrollUntilVisible:
          element:
            text: '.*${DE_NAME_PRO.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
          direction: DOWN
          timeout: 60000
          speed: 70
          waitToSettleTimeoutMs: 500
      - assertVisible:
          text: "Pro"
          above:
            text: '.*${DE_NAME_PRO.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - takeScreenshot: artifacts/KDE-11-badge-pro

# --- TC_12: đề Free -> KHÔNG hiển thị badge "Pro" ---
- runFlow:
    when:
      true: ${DE_NAME_FREE != null && DE_NAME_FREE != 'undefined' && DE_NAME_FREE != ''}
    commands:
      - scrollUntilVisible:
          element:
            text: '.*${DE_NAME_FREE.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
          direction: DOWN
          timeout: 60000
          speed: 70
          waitToSettleTimeoutMs: 500
      - assertNotVisible:
          text: "Pro"
          above:
            text: '.*${DE_NAME_FREE.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - takeScreenshot: artifacts/KDE-12-khong-co-badge-pro

# --- TC_13: đề "Chưa công khai" trên CMS -> ẩn khỏi danh sách (QA tự set up thủ công trước) ---
- runFlow:
    when:
      true: ${DE_NAME_UNPUBLISHED != null && DE_NAME_UNPUBLISHED != 'undefined' && DE_NAME_UNPUBLISHED != ''}
    commands:
      - repeat:
          times: 15
          commands:
            - swipe:
                direction: DOWN
                duration: 250
            - assertNotVisible:
                text: '.*${DE_NAME_UNPUBLISHED.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - takeScreenshot: artifacts/KDE-13-de-chua-cong-khai-an

# --- TC_15: đề bị xóa hẳn trên CMS -> mất card phía App (QA tự xóa thủ công trước) ---
- runFlow:
    when:
      true: ${DE_NAME_CMS_DELETED != null && DE_NAME_CMS_DELETED != 'undefined' && DE_NAME_CMS_DELETED != ''}
    commands:
      - repeat:
          times: 15
          commands:
            - swipe:
                direction: DOWN
                duration: 250
            - assertNotVisible:
                text: '.*${DE_NAME_CMS_DELETED.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - takeScreenshot: artifacts/KDE-15-de-bi-xoa-tren-cms

# --- TC_16: bấm chọn 1 Card đề -> chuyển đúng màn "Thông tin đề" ---
- runFlow:
    when:
      true: ${DE_NAME_NAV != null && DE_NAME_NAV != 'undefined' && DE_NAME_NAV != ''}
    commands:
      - scrollUntilVisible:
          element:
            text: '.*${DE_NAME_NAV.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
          direction: DOWN
          timeout: 60000
          speed: 70
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: '.*${DE_NAME_NAV.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - extendedWaitUntil:
          visible:
            text: ".*(Thời lượng tối đa|Tổng số câu|Bắt đầu làm bài|Tiếp tục làm bài).*"
          timeout: 15000
      - assertVisible:
          text: '.*${DE_NAME_NAV.replace(/[.*+?^()|[\]\\]/g, function(m){return "\\" + m})}.*'
      - takeScreenshot: artifacts/KDE-16-tap-card-vao-thong-tin-de
