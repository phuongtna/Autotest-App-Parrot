# LB-32..43 - Nhom "De KHONG gan thoi gian theo Section" (1 dong ho chung ca de), chuyen the tu
# TC_PAR_OnThiLamBai_32..43 (Ôn thi.xlsx). Mirror cau truc LB-15_to_20/LB-21_to_31 nhung doi fixture
# sang WHOLE_EXAM (detectSectionTimerMode() trong onThiExamEngine.js) - KHAC BIET CHINH da CONFIRMED
# qua docblock onThiExamEngine.js: nhan "Chuyen phan" + popup "Ban muon chuyen phan khac?" KHONG BAO
# GIO xuat hien o che do nay - het cau cuoi 1 section (khong phai section cuoi) nhan van la
# "Tiep theo" va bam vao la chuyen THANG sang section ke, KHONG popup xac nhan.
#
# TAI SU DUNG: ../helpers/open-de.yaml, ../helpers/launch-keep-session.yaml,
# ../helpers/launch-fresh.yaml, ../helpers/advance-onthi-questions.yaml.
#
# Tham so:
#   PHONE, OTP
#   DE_NAME_WHOLE_EXAM (bat buoc) - de KHONG section nao gan thoi luong, >=2 section, >=1 cau nhom.
#   SECTION_1_QUESTIONS_BEFORE_LAST (bat buoc cho TC_38) - so cau tra loi de dung o cau CUOI section 1.
#   TOTAL_QUESTIONS_BEFORE_LAST (bat buoc cho TC_39/42/43) - so cau tra loi de dung o cau CUOI CUNG de.
#   SECTION_1_FIRST_QUESTION_NO (bat buoc cho TC_40, mac dinh "1") - so cau section 1.
#   LAST_SECTION_FIRST_QUESTION_NO (bat buoc cho TC_40) - so cau DAU TIEN cua section CUOI CUNG
#     (chua tung mo toi) - dung de chung minh KHONG section nao bi khoa.
#   GROUP_FIRST_CHILD_NO / GROUP_LAST_CHILD_NO (optional, cho TC_41).
#   DE_LIST_TAP_POINT_WHOLE_EXAM (optional, "X%,Y%") - xem GAP THAT 2026-11-18 ben duoi, dung khi
#     danh sach co the trung ten gay tap nham.
#
# GAP THAT DA XAC MINH DUT DIEM (2026-11-17/18): truyen DE_NAME_WHOLE_EXAM co dau tieng Viet qua
# `-e` dong lenh khien assertVisible/scrollUntilVisible LUON fail dù the dang hien RO RANG tren man
# hinh (xac nhan qua test co lap). Chuoi ASCII thuan lay tu CHINH ten de (khong dau) lai KHOP DUNG
# ngay - CHI AP DUNG CHO GIA TRI TRUYEN QUA `-e` (text viet THANG trong file .yaml van hien dung).
#
# GAP THAT KHAC (2026-11-18, cung loai bug da ghi o LB-21_to_31-cta-popup.yaml): danh sach "Đề thầy
# cô giao" co the co NHIEU the - tapOn "Làm bài" below title/due-date co the tap NHAM sang CTA cua 1
# the HOAN TOAN khac nam duoi trong danh sach do co che "below" cua Maestro khong bat buoc ke sat.
# FIX: dung DE_LIST_TAP_POINT_WHOLE_EXAM (tap theo toa do % thay vi text/below) - da verify "50%,58%"
# tap DUNG the dau tien khi danh sach chua cuon (the moi giao/due gan nhat luon noi len dau danh
# sach "2 tuần gần nhất"). LUON giao lai 1 ban fixture MOI (xem automation/_scratch_reassign_1_ky_nang.mjs
# lam mau) NGAY TRUOC khi chay file nay.
#
# GAP THAT #3 - QUAN TRONG NHAT (2026-11-18): 2 fixture dung thu dau tien ("Đề thi chung 1 kỹ năng"
# VA ban dau cua "Đề kiểm tra cuối kỳ 1") deu THUC CHAT la PER_SECTION (moi dong "Cau truc de" co kem
# "N phut" -> dung theo detectSectionTimerMode() trong onThiExamEngine.js), KHONG phai WHOLE_EXAM -
# xac nhan that qua live device: tai cau cuoi section 1 hien dung nut "Chuyển phần" + popup "Bạn
# muốn chuyển phần khác?" (hanh vi PER_SECTION, giong TC_22, KHONG phai TC_38). Da nho sua truc tiep
# tren Web de "Đề kiểm tra cuối kỳ 1" KHONG con gan phut rieng tung section (Cau truc de chi con ten
# section, khong co "N phut" kem theo) - DUNG WHOLE_EXAM that, xac nhan lai qua live device: cau cuoi
# section 1 nhan "Tiếp theo" (KHONG "Chuyển phần"), KHONG popup. LUU Y: sua noi dung de tren Web
# KHONG tu dong cap nhat cac ban DA GIAO o "Đề thầy cô giao" - PHAI giao lai 1 ban MOI moi lay dung
# cau truc da sua (khac "Kho đề Parrot" - ben do tu cap nhat nhung CHI cho luot MOI, luot dang lam
# do van giu du lieu cu).
#
# GAP THAT #4 (2026-11-18): dong ho de tinh theo THOI GIAN THUC ke tu luc bam "Bắt đầu làm bài" LAN
# DAU, ke ca khi dong/mo lai app hay dung han `maestro test` giua chung - moi lan do/xem man hinh (ke
# ca CHI xem, neu lo KHONG dung STOP_AT_INFO_SCREEN) deu VO TINH bam bat dau va tieu hao ngan sach
# thoi gian cua CHINH fixture do. "Đề kiểm tra cuối kỳ 1" tong 10 phut - LUON giao lai 1 ban HOAN
# TOAN MOI (chua tung mo) NGAY TRUOC khi chay that, KHONG dung ban da tung xem/do truoc do.
#
# GAP THAT #5 (2026-11-18, DA SUA LAI SAU KHI HIEU DUNG): cau hoi dang NHOM (1 bai doc + nhieu cau
# con True/False, section "Nói phản xạ 123" nhung noi dung la doc hieu - ten section hien thi KHONG
# khop noi dung, co the la nham lan fixture/CMS, KHONG anh huong logic test) - MOI CAU CON duoc tinh
# la 1 "cau" RIENG trong he thong (xac nhan that qua bottom sheet: tap thang so "9" tu sheet ra DUNG
# "Câu 9, 1/10"; so "10" la "Câu 10, 2/10"; ...; cau 9..18 tuong ung child 1/10..10/10) - KHONG phai
# "1 cau cha phan trang noi bo" nhu hieu lam ban dau. Vi vay GROUP_FIRST_CHILD_NO="9"/
# GROUP_LAST_CHILD_NO="18" (= dung LAST_SECTION_FIRST_QUESTION_NO toi cau cuoi de, vi nhom nay chiem
# TRON VEN section cuoi) DA VERIFY PASS THAT (ca 2 so hien dung la 2 entry rieng, tap duoc, trong
# bottom sheet). Rieng tong so LAN TAP can de di het de van LON HON "tong so cau" hien thi do CTA
# "Tiếp theo" phai tap rieng cho TUNG child (18 cau nhung can >=60 lan tap neu tinh ca thao tac mo
# dau) - da nang COUNT an toan cho vong lap STOP_BEFORE_LAST tu 25 len 60 (van giu nguyen, khong anh
# huong gi den ket luan GROUP_* o tren).
#
# Tham so THAT DA VERIFY PASS (2026-11-18): DE_NAME_WHOLE_EXAM="tra" (chuoi con ASCII cua "Đề kiểm
# tra cuối kỳ 1", ban DA SUA khong gan phut section), DE_LIST_TAP_POINT_WHOLE_EXAM="50%,58%",
# SECTION_1_QUESTIONS_BEFORE_LAST="7" (section 1 = cau 1-8), LAST_SECTION_FIRST_QUESTION_NO="9"
# (section cuoi bat dau cau 9), GROUP_FIRST_CHILD_NO="9", GROUP_LAST_CHILD_NO="18".
appId: ${APP_ID}
tags:
  - regression
  - data-dependent
name: LB-32_to_43 De khong gan thoi gian theo Section
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow:
    file: ../helpers/open-de.yaml
    env:
      DE_NAME: ${DE_NAME_WHOLE_EXAM}
      DE_LIST_TAP_POINT: ${DE_LIST_TAP_POINT_WHOLE_EXAM}
      ON_THI_TAB: "Đề thầy cô giao"

# --- TC_32: man Doing hien 1 dong ho chung + Tien do + Tiep theo + Danh sach cau hoi ---
- assertVisible:
    id: "exam_prep_doing_timer"
- assertVisible: "Tiếp theo"
- assertVisible:
    text: "\\d+/\\d+"
- takeScreenshot: artifacts/LB-32-man-doing-whole-exam

# --- TC_33/34: gia tri/mau dong ho chinh xac - CHI chup man hinh doi chieu bang mat (xem
# readTimerBadge() best-effort, cung gioi han da ghi nhan o CD-*.yaml).
- takeScreenshot: artifacts/LB-33-34-dong-ho-chung-doi-chieu-bang-mat

# --- TC_36: Tien do tinh theo tong so cau ca de, khong chia theo section ---
# GAP THAT (2026-11-18): assertNotVisible "^0/\d+$" sau khi di chuyen 1 cau SAI thuc te - vi
# advance-onthi-questions.yaml (ban don gian hoa 2026-11-15) chi di chuyen, KHONG tra loi cau nao,
# nen tu so tien do (so cau DA TRA LOI) khong tang - day la hanh vi DUNG cua helper, khong phai loi.
# Chi con xac nhan duoc phan "mau so/dinh dang 1 bo dem duy nhat cho CA DE" (khong chia rieng theo
# section) qua 1 lan assert o tren - phan "tu so tang khi tra loi" KHONG tu dong hoa duoc nua voi
# helper hien tai (can helper THAT SU tra loi moi kiem tra lai duoc).
- takeScreenshot: artifacts/LB-36-tien-do-tinh-ca-de

# ======================================================================================
# TC_37/38/40/41 - can dung o CAU CUOI section 1 (khong phai section cuoi).
# ======================================================================================
- runFlow:
    file: ../helpers/launch-fresh.yaml
- runFlow:
    file: ../helpers/open-de.yaml
    env:
      DEVICE_MODE: "true"
      DE_NAME: ${DE_NAME_WHOLE_EXAM}
      DE_LIST_TAP_POINT: ${DE_LIST_TAP_POINT_WHOLE_EXAM}
      ON_THI_TAB: "Đề thầy cô giao"

# --- TC_37: bam Tiep theo o cau KHONG phai cau cuoi section -> sang cau ke, cung section ---
- assertVisible: "Tiếp theo"
- runFlow:
    file: ../helpers/advance-onthi-questions.yaml
    env:
      COUNT: "1"
      AUTO_CONFIRM_SUBMIT: "false"
- takeScreenshot: artifacts/LB-37-sang-cau-ke-cung-section

- runFlow:
    file: ../helpers/advance-onthi-questions.yaml
    env:
      COUNT: ${SECTION_1_QUESTIONS_BEFORE_LAST}
      AUTO_CONFIRM_SUBMIT: "false"

# --- TC_38: cau cuoi section 1 van nhan "Tiep theo" (KHONG "Chuyen phan") -> bam -> sang THANG
# section 2, KHONG popup xac nhan nao ---
- assertVisible: "Tiếp theo"
- assertNotVisible: "Chuyển phần"
- tapOn: "Tiếp theo"
- assertNotVisible: "Bạn muốn chuyển phần khác?"
- extendedWaitUntil:
    visible:
      id: "exam_prep_doing_screen"
    timeout: 10000
- takeScreenshot: artifacts/LB-38-chuyen-thang-section-khong-popup

# --- TC_40: bottom sheet cho phep chon TU DO moi section, KHONG section nao bi khoa ---
- runFlow:
    when:
      true: ${LAST_SECTION_FIRST_QUESTION_NO != null && LAST_SECTION_FIRST_QUESTION_NO != 'undefined'}
    commands:
      - tapOn:
          text: "\\d+/\\d+"
      - extendedWaitUntil:
          visible: "Danh sách câu hỏi"
          timeout: 10000
      - tapOn:
          text: "^${LAST_SECTION_FIRST_QUESTION_NO}$"
      # GAP THAT (2026-11-14, xem LB-47_48-luu-cuc-bo.yaml va LB-15_to_20 TC_19): assertNotVisible
      # cua "Danh sach cau hoi" FAIL that du screenshot cung luc xac nhan sheet da dong - gioi han
      # that cua Maestro voi component nay. Bo check sheet-da-dong, chi chup man hinh doi chieu.
      - takeScreenshot: artifacts/LB-40-chuyen-tu-do-sang-section-cuoi-khong-khoa

# --- TC_41: cau nhom cha-con tinh rieng tung cau con (giong TC_20, fixture WHOLE_EXAM) ---
- runFlow:
    when:
      true: ${GROUP_FIRST_CHILD_NO != null && GROUP_FIRST_CHILD_NO != 'undefined' && GROUP_LAST_CHILD_NO != null && GROUP_LAST_CHILD_NO != 'undefined'}
    commands:
      - tapOn:
          text: "\\d+/\\d+"
      - extendedWaitUntil:
          visible: "Danh sách câu hỏi"
          timeout: 10000
      - assertVisible:
          text: "^${GROUP_FIRST_CHILD_NO}$"
      - assertVisible:
          text: "^${GROUP_LAST_CHILD_NO}$"
      - takeScreenshot: artifacts/LB-41-cau-nhom-tinh-rieng-tung-cau-con
      # GAP THAT (2026-11-14, xem LB-15_to_20): `back` co the bung popup "Ngung lam bai?" thay vi
      # dong sheet (flaky, da gap that it nhat 1 lan) - dong bang cach tap lai nut x/y da dung de mo.
      - tapOn:
          text: "\\d+/\\d+"

# ======================================================================================
# TC_39/42 - can dung o CAU CUOI CUNG toan de.
# ======================================================================================
- runFlow:
    file: ../helpers/launch-fresh.yaml
- runFlow:
    file: ../helpers/open-de.yaml
    env:
      DEVICE_MODE: "true"
      DE_NAME: ${DE_NAME_WHOLE_EXAM}
      DE_LIST_TAP_POINT: ${DE_LIST_TAP_POINT_WHOLE_EXAM}
      ON_THI_TAB: "Đề thầy cô giao"
# Dung STOP_BEFORE_LAST (xem ghi chu GAP THAT trong LB-21_to_31-cta-popup.yaml/
# advance-onthi-questions.yaml, 2026-11-17) thay vi dem cung COUNT=TOTAL_QUESTIONS_BEFORE_LAST -
# vong lap tu dung dung luc gap nhan "Nộp bài", tranh rui ro doan sai so tap/bi nop som do het gio.
# COUNT="60" (2026-11-18, tang tu 25): fixture "Đề kiểm tra cuối kỳ 1" co 1 cau NHOM (vd group doc
# hieu doan van voi nhieu cau con True/False) - moi cau con tinh 1 tap rieng (xem "Câu N, x/y" o
# header) nen tong so tap can de het 18 "cau" (theo nghia dinh dang x/y) lon hon nhieu 18 - 25 KHONG
# du, da gap that (dung lai o giua chung, "Nộp bài" header luon hien dien nen khong dung nham).
- runFlow:
    file: ../helpers/advance-onthi-questions.yaml
    env:
      COUNT: "60"
      AUTO_CONFIRM_SUBMIT: "true"
      STOP_BEFORE_LAST: "true"

# --- TC_39: nhan nut doi thanh "Nop bai" o cau cuoi cung ---
- assertVisible: "Nộp bài"
- assertNotVisible: "Tiếp theo"
- takeScreenshot: artifacts/LB-39-nhan-nop-bai-cau-cuoi

# --- TC_42: bam "Nop bai" -> popup -> chon "Nop bai" -> sang man Ket qua ---
- tapOn: "Nộp bài"
- extendedWaitUntil:
    visible: "Nộp bài ngay?"
    timeout: 10000
- tapOn: "Nộp bài"
- extendedWaitUntil:
    visible: "Kết quả bài thi"
    timeout: 20000
- takeScreenshot: artifacts/LB-42-vao-man-ket-qua

# ======================================================================================
# TC_43 - popup Thoat -> luu + "Dang lam do" (fixture WHOLE_EXAM).
# ======================================================================================
- runFlow:
    file: ../helpers/launch-fresh.yaml
- runFlow:
    file: ../helpers/open-de.yaml
    env:
      DEVICE_MODE: "true"
      DE_NAME: ${DE_NAME_WHOLE_EXAM}
      DE_LIST_TAP_POINT: ${DE_LIST_TAP_POINT_WHOLE_EXAM}
      ON_THI_TAB: "Đề thầy cô giao"
- runFlow:
    file: ../helpers/advance-onthi-questions.yaml
    env:
      COUNT: "1"
      AUTO_CONFIRM_SUBMIT: "false"
- tapOn:
    id: "exam_prep_doing_header_left"
- extendedWaitUntil:
    visible: "Ngừng làm bài?"
    timeout: 10000
- tapOn: "Thoát"
- runFlow:
    file: ../helpers/open-de.yaml
    env:
      DEVICE_MODE: "true"
      DE_NAME: ${DE_NAME_WHOLE_EXAM}
      DE_LIST_TAP_POINT: ${DE_LIST_TAP_POINT_WHOLE_EXAM}
      ON_THI_TAB: "Đề thầy cô giao"
      STOP_AT_INFO_SCREEN: "true"
- assertVisible: "Tiếp tục làm bài"
- assertNotVisible: "Bắt đầu làm bài"
- takeScreenshot: artifacts/LB-43-sau-khi-thoat-trang-thai-dang-lam-do

# ======================================================================================
# TC_35 (OPTIONAL, mac dinh BO QUA - het gio toan de -> tu dong nop, KHONG popup xac nhan) - cung
# co che "cho thoi gian that" nhu CD-25/TC_25, GATE bang RUN_LB35_TIMEOUT_AUTOSUBMIT - can
# DE_NAME_WHOLE_EXAM_SHORT_TIMER (de rieng, thoi luong vai chuc giay) de khong ton CI.
# ======================================================================================
- runFlow:
    when:
      true: ${RUN_LB35_TIMEOUT_AUTOSUBMIT == 'true'}
    commands:
      - runFlow:
          file: ../helpers/launch-fresh.yaml
      - runFlow:
          file: ../helpers/open-de.yaml
          env:
            DEVICE_MODE: "true"
            DE_NAME: ${DE_NAME_WHOLE_EXAM_SHORT_TIMER}
            ON_THI_TAB: "Đề thầy cô giao"
      - extendedWaitUntil:
          visible: "Kết quả bài thi"
          timeout: "${LB35_TIMEOUT_WAIT_MS == null || LB35_TIMEOUT_WAIT_MS == 'undefined' ? 90000 : LB35_TIMEOUT_WAIT_MS}"
      - assertNotVisible: "Nộp bài ngay?"
      - takeScreenshot: artifacts/LB-35-het-gio-tu-dong-nop-khong-popup
