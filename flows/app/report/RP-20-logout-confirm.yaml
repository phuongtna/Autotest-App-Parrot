# RP-20 — Đăng xuất THẬT (xác nhận)
# Kỳ vọng: unregister FCM token -> gọi logoutAsync -> signOut -> về màn Đăng nhập
# CẢNH BÁO: case này phá session. Đã gắn tag "destructive" và bị loại khỏi
#           bộ regression mặc định (xem excludeTags trong config.yaml).
#           Chạy riêng bằng: maestro test .maestro/report/RP-20-logout-confirm.yaml
# Tags: destructive, regression
appId: ${APP_ID}
tags:
  - writes
  - destructive
  - regression
name: RP-20 Dang xuat - xac nhan
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-report.yaml

- scrollUntilVisible:
    element:
      text: ".*(Đăng xuất).*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*(Đăng xuất).*"
- extendedWaitUntil:
    visible: ".*(Bạn có thật sự muốn đăng xuất khỏi ứng dụng?).*"
    timeout: 15000
# LƯU Ý: regex rộng ".*(Đăng xuất|Đồng ý|OK|Xác nhận).*" khớp luôn vào text của
# chính message dialog ("...muốn đăng xuất khỏi ứng dụng?", chứa "đăng xuất" không
# phân biệt hoa/thường) -> index:0 tap trúng dòng message (không phải nút), dialog
# không đóng. Nút xác nhận thật của dialog này là "OK" (nút "Hủy" mới là huỷ).
- tapOn:
    text: "OK"

- extendedWaitUntil:
    visible:
      text: ".*(Nhập số điện thoại|Đăng nhập).*"
    timeout: 40000
- assertNotVisible: ".*(Quản lý tài khoản).*"

- takeScreenshot: artifacts/RP-20-logged-out
