# Testcase: TC_05 (nhánh 2/2) - Mở lại popup, bấm nút back thiết bị -> theo kế hoạch test, kỳ vọng
# "Popup đóng, hành vi giống hệt 'Ở lại' - dữ liệu không đổi" (giống hệt nhánh tap-ra-ngoài ở
# RKL-05-cancel-via-outside-tap.yaml).
#
# PHÁT HIỆN THẬT (2026-09-07, thiết bị 3201d866d40a1681, Maestro `back` = phím back Android):
# nút back thiết bị KHÔNG đóng popup "Xác nhận rời khỏi lớp" - popup vẫn hiển thị y nguyên sau khi
# bấm back (verify bằng 2 screenshot liên tiếp cách nhau 1s, cả tap-ra-ngoài (RKL-05) VÀ "Ở lại"
# (RKL-04) đều đóng popup bình thường ở cùng màn hình đó - chỉ riêng back là không). Đây có thể là
# BUG thật (popup không đăng ký handler cho hardware back trên Android, dù các cách đóng khác đều
# hoạt động), KHÔNG phải lỗi automation.
#
# Case này viết đúng theo kỳ vọng của kế hoạch test (assert popup phải đóng sau khi back) - SẼ FAIL
# ở bước cuối cho tới khi app xử lý đúng hardware back cho popup này. Dùng để CHỐT/THEO DÕI bug,
# không xoá hay sửa assert để "cho qua". Nếu app đã fix, case sẽ tự PASS mà không cần sửa gì thêm.
#
# HỆ QUẢ VẬN HÀNH (đã xác nhận thật khi case FAIL đúng như dự kiến): Maestro DỪNG NGAY tại assertion
# FAIL, các bước "dọn dẹp" phía sau (đóng popup) KHÔNG chạy được - máy bị để lại với popup vẫn đang
# mở. Vì vậy: CHẠY CASE NÀY CÔ LẬP hoặc CUỐI CÙNG trong 1 lượt (không xếp trước các case khác trong
# cùng 1 lần `maestro test` nối tiếp) - nếu chạy trong CI/batch, thêm 1 bước `launchApp:
# {stopApp: true}` ngay sau case này (không phải sau case khác) để đảm bảo màn hình sạch cho case
# tiếp theo.
#
# Chạy: maestro test flows/app/roi_khoi_lop/RKL-05b-back-button-does-not-dismiss-popup-BUG.yaml \
#   -e APP_ID=com.inet.parrotedu -e PHONE=0915775115 -e OTP=888888 -e PROFILE_WITH_CLASS=Hang
appId: ${APP_ID}
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow:
    file: ../helpers/goto-profile-edit.yaml
    env:
      PROFILE_NAME: ${PROFILE_WITH_CLASS}

- tapOn: "Rời khỏi lớp"
- extendedWaitUntil:
    visible:
      text: "Xác nhận rời khỏi lớp"
    timeout: 10000

- back

# Kỳ vọng theo kế hoạch test: popup phải đóng trong tối đa 5s sau khi bấm back.
# THỰC TẾ (2026-09-07): assert này FAIL - popup vẫn còn hiển thị. Xem ghi chú ở đầu file.
- extendedWaitUntil:
    notVisible:
      text: "Xác nhận rời khỏi lớp"
    timeout: 5000
- takeScreenshot: rkl05b_back_button_bug_popup_still_open

# Dọn dẹp - CHỈ thật sự chạy tới đây nếu assert trên bất ngờ PASS (tức app đã fix bug, popup đã
# đóng đúng sau back). Nếu case đang FAIL đúng như dự kiến, Maestro dừng lại NGAY ở assertion phía
# trên - các dòng dưới đây không chạy, máy bị để lại với popup còn mở. Xem "HỆ QUẢ VẬN HÀNH" ở đầu
# file.
- tapOn: "Ở lại"
