# HW-12_13 — Vòng đời consent AI: TỪ CHỐI trước, ĐỒNG Ý sau
# Gộp từ HW-13 (từ chối "Để sau", dialog đóng không điều hướng, tap lại -> dialog hiện lại)
# và HW-12 (đồng ý "Tiếp tục" -> vào màn làm bài). Cả 2 đều bắt buộc launch-wipe.yaml (xoá
# state - thao tác tốn nhất trong suite vì cần đăng nhập lại bằng OTP thật) vì consent được
# persist trong Redux.
#
# THỨ TỰ BẮT BUỘC: từ chối (HW-13) PHẢI chạy TRƯỚC đồng ý (HW-12). Một khi đã "Tiếp tục"
# (đồng ý), consent được lưu vĩnh viễn và dialog sẽ KHÔNG hiện lại - nếu đảo thứ tự, case từ
# chối sẽ không còn test được từ state sạch. Nhờ chạy đúng thứ tự, chỉ cần 1 lần launch-wipe
# thay vì 2.
# Tags: needs-login, writes, regression
appId: ${APP_ID}
tags:
  - needs-login
  - writes
  - regression
name: HW-12_13 AI consent - tu choi truoc, dong y sau
---
- runFlow: ../helpers/launch-wipe.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

# --- HW-13: Từ chối consent AI ("Để sau") ---
- scrollUntilVisible:
    element:
      text: ".*(Làm bài|Tiếp tục|Chinh phục).*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ".*(Làm bài|Tiếp tục|Chinh phục).*"
    index: 0

- extendedWaitUntil:
    visible: ".*(AI hỗ trợ học tập).*"
    timeout: 15000
- tapOn: ".*(Để sau).*"

- extendedWaitUntil:
    notVisible: "AI hỗ trợ học tập"
    timeout: 10000

# Vẫn ở tab Bài tập, KHÔNG điều hướng sang màn làm bài
- assertVisible: ".*(Bài tập).*"
- assertNotVisible: ".*(Kiểm tra).*"

# Tap lại lần 2 -> dialog PHẢI hiện lại (chứng minh khoá chống spam đã nhả)
- tapOn:
    text: ".*(Làm bài|Tiếp tục|Chinh phục).*"
    index: 0
- extendedWaitUntil:
    visible: ".*(AI hỗ trợ học tập).*"
    timeout: 15000
- tapOn: ".*(Để sau).*"
- extendedWaitUntil:
    notVisible: "AI hỗ trợ học tập"
    timeout: 10000

- takeScreenshot: artifacts/HW-13-consent-decline

# --- HW-12: Đồng ý consent AI ("Tiếp tục") -> vào màn làm bài, lần sau không hỏi lại ---
- tapOn:
    text: ".*(Làm bài|Tiếp tục|Chinh phục).*"
    index: 0

- extendedWaitUntil:
    visible: ".*(AI hỗ trợ học tập).*"
    timeout: 15000
- assertVisible: ".*(Tiếp tục).*"
- assertVisible: ".*(Để sau).*"
- takeScreenshot: artifacts/HW-12-consent-dialog

- tapOn: ".*(Tiếp tục).*"

# Vào màn làm bài: header có nút X + tên bài, có nút "Kiểm tra" hoặc nội dung câu hỏi
- extendedWaitUntil:
    visible:
      text: ".*(Kiểm tra|Tiếp theo|Nhập câu trả lời).*"
    timeout: 40000

- takeScreenshot: artifacts/HW-12-doing-screen
