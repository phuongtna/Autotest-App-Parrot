# HW-14_15 — Lifecycle vòng đời làm bài của MỘT assignment cụ thể: mở ĐÚNG bài -> thoát giữa
# chừng bằng X (chưa trả lời câu nào) -> quay lại tab Bài tập -> xác nhận card đổi thành
# "Tiếp tục" -> bấm "Tiếp tục" resume ĐÚNG bài đó -> làm hết bằng exercise handler chung (không
# giả định loại câu hỏi) -> màn kết quả -> xác nhận card vẫn còn đúng bài (giờ đã hoàn thành).
#
# KHÁC bản gốc: KHÔNG còn chọn bài theo `tapOn: {text: ..., index: 0}` - PHẢI được gọi kèm tham số
# EXERCISE_NAME = title của 1 assignment CÓ THẬT (khớp chính xác text hiển thị trên card App HS).
# Không có EXERCISE_NAME thì dùng mặc định "Read and choose" (giống flows/helpers/open-exercise.yaml)
# - mặc định này CHỈ để chạy độc lập lúc dev/kiểm tra riêng cơ chế resume, KHÔNG chứng minh được
# "resume đúng bài GV vừa giao" (muốn chứng minh việc đó, xem
# flows/giao_bai_tap/e2e-teacher-assign-student-lifecycle.mjs - script đó giao bài thật qua Web GV
# rồi tự truyền EXERCISE_NAME=title vừa tạo vào flow này).
#
# EXERCISE_DUE_DATE_DM (optional, "DD/MM"): TRUYỀN KHI CÓ THỂ - nếu EXERCISE_NAME trùng title với
# ≥1 card khác (ĐÃ GẶP THẬT: 1 bài từng giao trước đó còn tồn tại quá hạn + bài mới cùng tên), neo
# theo "Hạn nộp DD/MM" (duy nhất hơn) thay vì theo title khi tìm lại card ở bước resume - xem cùng
# cơ chế trong flows/helpers/open-exercise.yaml.
#
# Nếu câu hỏi trong bài (bất kỳ câu nào, không chỉ câu đầu) là SPEAK (".*Nhấn để nói.*"): case này
# sẽ FAIL CÓ CHỦ ĐÍCH với thông báo chứa "BLOCKED_MISSING_EXERCISE_HANDLER" (xem
# flows/helpers/answer-current-exercise-generic.yaml) - repo hiện CHƯA có cách an toàn để vượt qua
# câu SPEAK trên route tab Bài tập (đã xác nhận thật: bấm mic trên thiết bị thật khiến app thoát ra
# ngoài, xem flows/exercise/README.md mục 2 + flows/exercise/EX-12-speaking-record-result.yaml).
# KHÔNG coi lỗi này là flaky - đây là giới hạn đã biết, cần handler riêng mới tự động hoá được.
#
# SCREENSHOT PATH (2026-08-12): Maestro 2.8.0 từ chối MỌI path takeScreenshot có ".." (đã xác
# nhận qua probe cô lập, không phụ thuộc device/app - lỗi "resolves outside this run's
# takeScreenshot output folder" xảy ra ngay cả với --test-output-dir tuỳ ý). "../artifacts/..."
# dùng khắp repo (EX-*/HW-*/RP-*) đều lỗi trên version này - KHÔNG sửa hàng loạt các file đó (ngoài
# scope). CHỈ đổi path plain (không "..") trong CHÍNH file này (screenshot vẫn chụp được, lưu vào
# output folder mặc định của Maestro thay vì flows/artifacts/) - nếu không sửa, bước takeScreenshot
# FAILED sẽ abort cả flow, che mất kết quả lifecycle thật (PASS/BLOCKED) phía sau nó.
appId: ${APP_ID}
tags:
  - writes
  - regression
name: HW-14_15 Lifecycle - mo dung bai, thoat X, resume dung bai, hoan thanh
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}

# --- Ghi lại thanh tiến độ tổng "Bài tập X/Y" (đầu danh sách) TRƯỚC khi làm bài, để verify tăng
# đúng ở cuối flow. PHẢI đọc ở đây - ngay sau khi mở tab, CHƯA cuộn - cùng lý do/cơ chế đã xác
# nhận thật trong flows/bai_tap/complete_random_homework_success.yaml dòng 47-54 (cuộn rồi mới đọc
# khiến header bị khuất, copyTextFrom fail thật).
#
# ĐÃ SỬA (2026-08-12): "below: 'Bài tập'" KHÔNG unique - chữ "Bài tập" xuất hiện CẢ ở heading tiến
# độ ("Bài tập / 15/41") VÀ ở tab bar dưới cùng (đang active, cùng chữ). ĐÃ XÁC NHẬN THẬT qua debug
# script riêng (adb screenshot xác nhận ĐANG đứng đúng đầu danh sách, "Bài tập"+"15/41"+"Bài tập về
# nhà" đều hiện rõ, nhưng copyTextFrom vẫn trả về CHUỖI RỖNG) - khiến
# test_data/hw_fullluong_compare_progress.js crash "Cannot read property '0' of null" (không có
# digit nào trong chuỗi rỗng). Đổi anchor "below" sang dòng filter "2 tuần gần nhất"/"1 tháng gần
# nhất" (unique, luôn nằm ngay TRÊN heading "Bài tập" thật, không trùng tab bar).
- runFlow: ../helpers/open-tab-homework.yaml
- copyTextFrom:
    below: ".*(2 tuần gần nhất|1 tháng gần nhất).*"
    above: "Bài tập về nhà"
- runScript: ../../test_data/hw_fullluong_save_before_progress.js

# --- PROGRESS_BEFORE: đọc progress RIÊNG của ĐÚNG assignment sắp làm (vd "9/10") - KHÁC với
# thanh tiến độ TỔNG "Bài tập X/Y" vừa đọc ở trên. Phải đọc TRƯỚC khi gọi open-exercise.yaml
# (chưa cuộn/thao tác gì lên card).
#
# ĐÃ THỬ VÀ REVERT (2026-08-14): từng đổi sang `containsDescendants` (field có thật trong
# maestro.orchestra.yaml.YamlElementSelector, xác nhận qua javap bytecode) để tránh ambiguity của
# "below" (below chỉ so Y-coordinate MỘT CHIỀU, không có biên trên/"gần nhất" - xác nhận thật qua
# screen-hierarchy run /home/mt/.maestro/tests/2026-08-14_095027: 2 node "Hạn nộp 21/08" khác card
# cùng thoả "below" 1 title). NHƯNG containsDescendants ĐÃ CHỨNG MINH KHÔNG HOẠT ĐỘNG trong bản
# Maestro 2.8.0 này - xác nhận qua 4 test cô lập độc lập (assertVisible tĩnh, KHÔNG scroll, target
# "G3-U1_ Lesson 1:Listen and choose"/"Hạn nộp 19/08" ĐANG HIỂN THỊ THẬT trên màn hình lúc chạy,
# xác nhận bằng screenshot): containsDescendants với 2 item (dạng {text:...} lẫn dạng string
# thường), và với CHỈ 1 item duy nhất (text chính xác, không regex) - TẤT CẢ đều FAILED "Assertion
# is false" dù target visible 100%. Kết luận: containsDescendants không dùng được làm selector độc
# lập trong bản Maestro này (có thể cần 1 anchor khác đi kèm mà chưa xác định được, hoặc field này
# chưa hoạt động đúng như bytecode gợi ý) - REVERT về "below" gốc, chỉ giữ lại speed/timeout đã xác
# minh có tác dụng thật (xem 2 comment ngay dưới). Root cause ambiguity ("below" không có biên
# trên) vẫn ĐÚNG và CHƯA CÓ FIX - xử lý bằng cách khác nếu gặp lại (xem báo cáo cùng ngày).
#
# Cũng xác nhận qua hierarchy: title node có resource-id "homework_card_basic_<N>_title" (N = vị
# trí trong danh sách, KHÔNG phải id theo room) - app KHÔNG expose id ổn định theo
# room/assignment, nên không thể né ambiguity bằng cách đổi sang neo theo id.
#
# ĐÃ SỬA LẦN 2 (2026-08-14, root cause thật xác nhận qua run mới, room_id=a1b4e34a-9313-4895-8b10-
# 52731880d01a, title "G3-U2-Lesson 2: Listen and repeat", due 21/08): dùng due-date làm SCROLL
# TARGET vẫn FAILED "No visible element found: Hạn nộp 21/08" ở flows/helpers/locate-assignment-
# card.yaml dù screen-hierarchy chụp đúng frame FAILED xác nhận card mục tiêu đang hiển thị đầy đủ -
# lý do: due-date KHÔNG unique (mọi room test tự động trong ngày đều mặc định dueDate=hôm nay+N
# giống nhau), 1 card KHÁC cũng cùng due-date nằm liền kề khiến cơ chế phát hiện "cuộn không còn
# tiến triển" của scrollUntilVisible bị đánh lừa. ĐỔI CHIẾN LƯỢC: SCROLL TARGET = TITLE, due-date
# CHỈ dùng để VERIFY (assertVisible riêng, sau khi title đã visible) - copyTextFrom đọc progress vẫn
# neo "below title / above due-date" NHƯ CŨ (không đổi - đó là VỊ TRÍ đọc, không phải TARGET scroll,
# và range đó đã verify đúng vùng progress của card qua run PASS trước đây).
- runFlow:
    when:
      true: ${EXERCISE_DUE_DATE_DM != null}
    commands:
      # timeout: 150000 (2026-08-14, xác nhận thật qua diagnostic run /home/mt/.maestro/tests/
      # 2026-08-14_103346: hierarchy tại thời điểm FAILED xác nhận title mục tiêu KHÔNG tồn tại
      # trên cây view lúc đó - scroll chưa cuộn tới nơi trong 90s, KHÔNG liên quan containsDescendants).
      # Danh sách "Bài tập" của tài khoản test đã dài thêm do các room test tích luỹ qua nhiều lần
      # chạy trong ngày - tăng timeout để bù đúng vấn đề "chưa cuộn đủ sâu". Giữ nguyên giá trị này
      # sau khi revert selector vì vẫn là cải thiện hợp lệ, độc lập với vấn đề containsDescendants.
      - scrollUntilVisible:
          element:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
          direction: DOWN
          timeout: 150000
          speed: 70
          waitToSettleTimeoutMs: 500
      # VERIFY (không phải target scroll): xác nhận đúng "Hạn nộp DATE" hiện ngay dưới đúng title
      # vừa cuộn tới - nếu FAILED, title vừa tìm được KHÔNG phải card đúng hạn nộp mong đợi, dừng
      # lại (không tự đoán tiếp), không dùng copyTextFrom bên dưới cho tới khi verify này pass.
      - assertVisible:
          text: "Hạn nộp ${EXERCISE_DUE_DATE_DM}"
          below:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
      - copyTextFrom:
          below:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
          above:
            text: "Hạn nộp ${EXERCISE_DUE_DATE_DM}"
- runFlow:
    when:
      true: ${EXERCISE_DUE_DATE_DM == null}
    commands:
      - scrollUntilVisible:
          element:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
          direction: DOWN
          timeout: 90000
          speed: 70
          waitToSettleTimeoutMs: 500
      - copyTextFrom:
          below:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
- runScript: ../../test_data/hw_fullluong_save_before_card_progress.js
- takeScreenshot: HW-14_15-before-open-assignment

# --- Mở ĐÚNG assignment (không index 0 - open-exercise.yaml scroll+tap theo EXERCISE_NAME) ---
# DEVICE_MODE=true (ĐÃ SỬA 2026-08-12): file này ĐÃ launch-keep-session.yaml + login.yaml +
# open-tab-homework.yaml ở đầu chính flow này (xem 2 dòng đầu file) - KHÔNG truyền DEVICE_MODE thì
# open-exercise.yaml (branch ${DEVICE_MODE != 'true'}) tự relaunch app + login + mở lại tab "Bài
# tập" LẦN NỮA - dư thừa (ĐÃ QUAN SÁT THẬT: app thoát ra rồi vào lại tab Bài tập ngay sau khi vừa
# mở tab đó xong), tốn thời gian + tăng số lần relaunch app không cần thiết trên máy thật (góp phần
# vào tình trạng thiết bị/adb kém ổn định khi chạy nhiều lượt liên tiếp trong ngày). Đã ĐĂNG NHẬP +
# ĐANG Ở ĐÚNG tab "Bài tập" nên an toàn để bỏ qua bước relaunch+login này.
#
# ĐÃ SỬA (2026-08-14, root cause thật xác nhận qua run FAILED thật, /home/mt/.maestro/tests/
# 2026-08-14_141542, commands.json index 24-44): khi chạy flow này ĐỘC LẬP không truyền -e
# EXERCISE_NAME/-e EXERCISE_DUE_DATE_DM (đúng mode dev/kiểm tra riêng mà docblock đầu file mô tả -
# "mặc định này CHỈ để chạy độc lập lúc dev"), forward THẲNG "${EXERCISE_NAME}"/
# "${EXERCISE_DUE_DATE_DM}" (JS undefined ở scope ngoài) vào env: của runFlow bên dưới khiến Maestro
# STRINGIFY undefined thành CHUỖI "undefined" (xác nhận qua evaluatedCommand index 25:
# defineVariablesCommand.env = {"EXERCISE_NAME": "undefined", "EXERCISE_DUE_DATE_DM": "undefined"}
# - chuỗi thật, không phải null/undefined JS nữa). open-exercise.yaml bên trong chỉ so sánh
# "== null" (đúng với JS undefined thật) nên KHÔNG bắt được chuỗi "undefined" này: branch
# "${EXERCISE_DUE_DATE_DM != null}" bị đánh giá TRUE sai (chuỗi "undefined" không phải null), dẫn
# tới scrollUntilVisible/assertVisible tìm "Hạn nộp undefined" - FAILED "No visible element found:
# .*undefined.*" ngay ở lần mở bài ĐẦU TIÊN (chưa từng tới màn làm bài, index 44 là command CUỐI
# CÙNG chạy được trong run FAILED đó). Caller thật duy nhất (flows/giao_bai_tap/
# e2e-teacher-assign-student-lifecycle.mjs dòng 61-64) LUÔN truyền cả 2 biến này qua -e thật (không
# bao giờ để trống) nên không tự tái hiện bug này ở route đó - chỉ lộ ra khi chạy file này độc lập.
# SỬA: tách 2 nhánh theo EXERCISE_NAME == null (giống idiom 2 nhánh true/false đã dùng sẵn ở khối
# PROGRESS_BEFORE phía trên) - nhánh null KHÔNG đưa EXERCISE_NAME/EXERCISE_DUE_DATE_DM vào env: của
# open-exercise.yaml, để 2 biến đó giữ nguyên trạng thái JS-undefined thật bên trong nested flow
# (đúng như đã verify PASS ở scrollUntilVisible/copyTextFrom PROGRESS_BEFORE phía trên, index 20-21
# cùng run) thay vì bị ép thành chuỗi "undefined".
- runFlow:
    when:
      true: ${EXERCISE_NAME != null}
    commands:
      - runFlow:
          file: ../helpers/open-exercise.yaml
          env:
            PHONE: ${PHONE}
            OTP: ${OTP}
            EXERCISE_NAME: ${EXERCISE_NAME}
            EXERCISE_DUE_DATE_DM: ${EXERCISE_DUE_DATE_DM}
            DEVICE_MODE: "true"
- runFlow:
    when:
      true: ${EXERCISE_NAME == null}
    commands:
      - runFlow:
          file: ../helpers/open-exercise.yaml
          env:
            PHONE: ${PHONE}
            OTP: ${OTP}
            DEVICE_MODE: "true"
- takeScreenshot: HW-14_15-opened

# --- Thoát ngay bằng X (chưa trả lời câu nào) ---
- tapOn:
    id: "exercise_close_button"
- extendedWaitUntil:
    visible: ".*(Bài tập).*"
    timeout: 20000

# --- Refresh để state doing_answer_id được nạp lại (pattern đã verify, giữ nguyên từ bản gốc) ---
- swipe:
    start: 50%, 35%
    end: 50%, 85%
    duration: 600
- extendedWaitUntil:
    visible:
      text: ".*(Bài tập về nhà|Bài tập nâng cao).*"
    timeout: 30000

# --- Tìm ĐÚNG card vừa thoát (không index), xác nhận CTA đã đổi "Tiếp tục", rồi bấm ĐÚNG nó ---
# ĐÃ SỬA (2026-08-12, 2 lượt): lượt 1 neo DUY NHẤT theo "Hạn nộp DD/MM" (bỏ qua hẳn title) - GIẢ
# ĐỊNH SAI rằng Hạn nộp "duy nhất hơn" title. ĐÃ CHỨNG MINH SAI THẬT qua network capture +
# room_details.json (2026-08-12, room "G3-U19-L3: Listen and choose" due 19/08): tài khoản test 3B
# hiện có 8 room KHÁC NHAU cùng "Hạn nộp 19/08" (vì mọi lượt chạy tự động trong ngày đều mặc định
# dueDate=hôm nay+7 - collision thật, không phải giả thuyết) - đã bấm NHẦM sang "G3-U2-Lesson 3:
# Listen and repeat" (SPEAK) thay vì "G3-U19-L3: Listen and choose" (LISTENING) dù cả 2 đều "Hạn
# nộp 19/08" (ĐÃ XÁC NHẬN room thật của assignment vừa giao có answers=null suốt - "Tiếp tục" không
# xuất hiện là ĐÚNG, không phải bug persist state - xem room_details.json evidence).
#
# Lượt 2 (đổi hẳn sang neo DUY NHẤT theo title + assertVisible Hạn nộp riêng) CŨNG SAI kiểu khác -
# ĐÃ GẶP THẬT: scrollUntilVisible theo title dừng cuộn ngay khi title mới hé mép dưới màn hình,
# trong khi "Hạn nộp" của CHÍNH card đó vẫn ngoài khung nhìn - assertVisible sau đó luôn FAILED dù
# đang đứng ĐÚNG card.
#
# BẢN ĐÚNG: dùng compound selector CỦA CHÍNH scrollUntilVisible (element:{text, below} - ĐÃ VERIFY
# dùng thật trong flows/exercise/EX-12-speaking-record-result.yaml +
# flows/vui_hoc/study_unit9_protecting_environment.yaml) - cuộn tới khi ĐÚNG dòng "Hạn nộp DATE"
# nằm NGAY DƯỚI dòng title mong muốn cùng hiển thị - bắt buộc CẢ 2 điều kiện thoả mãn ĐỒNG THỜI
# trước khi dừng cuộn, đồng thời đảm bảo title phía trên cũng đã lọt vào khung nhìn.
- runFlow:
    when:
      true: ${EXERCISE_DUE_DATE_DM != null}
    commands:
      # waitToSettleTimeoutMs (ĐÃ GẶP THẬT 2026-08-12, xem chi tiết trong flows/helpers/
      # open-exercise.yaml cùng vị trí sửa): thiếu tham số này, scrollUntilVisible báo COMPLETED
      # ngay khi target chớm đủ ngưỡng visible nhưng scroll còn trớn, khiến lệnh NGAY SAU (assert/
      # tapOn, đọc hierarchy MỚI) không còn thấy target - set 500ms để chờ layout ổn định hẳn.
      - scrollUntilVisible:
          element:
            text: "Hạn nộp ${EXERCISE_DUE_DATE_DM}"
            below:
              text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
          direction: DOWN
          timeout: 90000
          speed: 70
          waitToSettleTimeoutMs: 500
      # ĐÃ GẶP THẬT (2026-08-12): "below: Hạn nộp DATE" 1 cấp (không kèm title) tại đây có thể khớp
      # NHẦM khi ≥2 card cùng "Hạn nộp 19/08" hiển thị đồng thời trong 1 khung nhìn (đã tái hiện:
      # khớp nhầm sang card "G3-U18-Lesson 3: Listen and match" đứng liền trước card mục tiêu) - lồng
      # thêm "below" cấp 2 trỏ về ĐÚNG title để buộc khớp ĐÚNG instance "Hạn nộp" của card mục tiêu.
      - assertVisible:
          text: "Tiếp tục"
          below:
            text: "Hạn nộp ${EXERCISE_DUE_DATE_DM}"
            below:
              text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
      - takeScreenshot: HW-14_15-card-shows-tieptuc
      - tapOn:
          text: "Tiếp tục"
          below:
            text: "Hạn nộp ${EXERCISE_DUE_DATE_DM}"
            below:
              text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
- runFlow:
    when:
      true: ${EXERCISE_DUE_DATE_DM == null}
    commands:
      - scrollUntilVisible:
          element:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
          direction: DOWN
          timeout: 90000
          speed: 70
          waitToSettleTimeoutMs: 500
      - assertVisible:
          text: "Tiếp tục"
          below:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
      - takeScreenshot: HW-14_15-card-shows-tieptuc
      - tapOn:
          text: "Tiếp tục"
          below:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
- runFlow:
    when:
      visible: ".*(AI hỗ trợ học tập).*"
    commands:
      - tapOn: ".*(Tiếp tục).*"
- extendedWaitUntil:
    visible:
      id: "exercise_close_button"
    timeout: 40000
- takeScreenshot: HW-14_15-resumed

# --- Hoàn thành bằng exercise handler chung (không giả định loại câu hỏi - xem helper) ---
# EXERCISE_NAME truyền thêm (2026-08-12, thay đổi thuần bổ sung, không đổi hành vi happy path):
# helper giờ là dispatcher có nhánh BLOCKED_MISSING_EXERCISE_HANDLER/BLOCKED_MISSING_UI_EVIDENCE
# tường minh (xem flows/helpers/answer-current-exercise-generic.yaml) - truyền tên bài đang làm
# vào để report BLOCKED (nếu có) biết đang chạy trên assignment nào, thay vì "không rõ".
- runFlow:
    file: ../helpers/answer-current-exercise-generic.yaml
    env:
      EXERCISE_NAME: ${EXERCISE_NAME}

# --- Màn kết quả ---
# ĐÃ SỬA (2026-08-12): nhãn cũ "Điểm số|Chính xác|Hoàn thành" (title-case) KHÔNG khớp UI thật -
# ĐÃ XÁC NHẬN THẬT qua screenshot + hierarchy dump thật (maestro hierarchy khi đang đứng đúng màn
# Kết quả): app render "ĐIỂM SỐ"/"CHÍNH XÁC" (chữ hoa, khác casing với chuỗi text cũ) - Maestro
# text match phân biệt hoa/thường nên assertion cũ không bao giờ khớp dù đã đúng màn. Hierarchy dump
# đó cũng cho thấy màn Kết quả có testID ỔN ĐỊNH riêng (resourceId, không phụ thuộc casing/ngôn ngữ)
# - dùng testID này thay cho text, đúng quy ước id: đã dùng khắp file (exercise_close_button,
# exercise_check_button...) thay vì thêm 1 regex text mới:
#   exercise_result_screen         - container toàn màn Kết quả
#   exercise_result_score_value    - số ĐIỂM SỐ
#   exercise_result_correct_value  - "N/M" CHÍNH XÁC
- extendedWaitUntil:
    visible:
      id: "exercise_result_screen"
    timeout: 60000
- takeScreenshot: HW-14_15-result

# --- Đóng kết quả -> về tab Bài tập ---
# CTA màn Kết quả: "Tiếp theo" (còn bài KHÁC chưa làm trong danh sách - bấm nó sẽ SANG bài đó,
# KHÔNG về danh sách) hoặc "Hoàn thành" (hết bài chưa làm - bấm về thẳng danh sách) - khớp mô tả
# flows/bai_tap/TESTCASES.md TC1 mục Output ("Tiếp theo" sang bài tập kế tiếp). Mục tiêu ở đây là
# VỀ DANH SÁCH (không phải sang bài khác) để verify lại đúng card vừa hoàn thành ở bước sau - vì
# vậy KHÔNG bấm "Tiếp theo" - dùng icon Close (X) góc phải trên.
#
# ĐÃ SỬA (2026-08-13): đổi từ tapOn theo toạ độ ("point: 92%,6%") sang tapOn theo id thật
# `exercise_result_close_button` - id này đã được xác nhận thật từ 2026-08-12 (debug bằng maestro
# hierarchy, xem flows/homework/DEBUG-result-x-probe-*.yaml, bounds đo thật [959,130][1038,166]
# trên màn 1080x2340, đúng vị trí điểm 92%,6% cũ) nhưng trước đó vẫn giữ toạ độ vì nguyên nhân
# treo thật nằm ở bước chờ phía dưới, không phải ở bước tap - nay ưu tiên selector ổn định hơn khi
# không còn lý do phải giữ nguyên.
- runFlow:
    when:
      visible: "Hoàn thành"
    commands:
      - tapOn:
          text: ".*(Hoàn thành).*"
- runFlow:
    when:
      visible: "Tiếp theo"
    commands:
      - tapOn:
          id: "exercise_result_close_button"
# ĐÃ SỬA (2026-08-12, root cause thật qua debug máy thật): "visible: '.*(Bài tập).*'" KHÔNG PHẢI
# tín hiệu "đã về danh sách" đáng tin - chính màn Kết quả (nơi vừa đứng, TRƯỚC khi tap X) cũng có
# header hiển thị "Bài tập X/Y" (đã xác nhận thật qua `maestro hierarchy`: text "Bài tập 19/47"
# nằm ngay cạnh icon X trên màn Kết quả) - nên điều kiện này THOẢ MÃN NGAY CẢ KHI tap X chưa từng
# rời khỏi màn Kết quả (vd tap trượt trúng banner push-notification thoáng qua đè lên đúng vùng X,
# ĐÃ QUAN SÁT THẬT xảy ra ngay sau khi hoàn thành bài). Hệ quả: bước chờ này PASS GIẢ, flow đi tiếp
# vào scrollUntilVisible tìm lại card (timeout 90000ms) trong khi app vẫn đứng ở màn Kết quả -
# không có gì để tìm - đây mới là chỗ flow "chạy mãi" thật sự, không phải ở bản thân bước tap X.
# SỬA: đổi sang anchor DUY NHẤT của MÀN DANH SÁCH thật - id "homework_screen" (root container của
# route tab Bài tập, ĐÃ VERIFY qua hierarchy: có mặt trên màn danh sách, KHÔNG có mặt trên màn Kết
# quả) - cùng kỹ thuật đã dùng thật trong flows/exercise/EX-08-connect-pairs.yaml dòng 93 cho đúng
# mục đích "xác nhận đã rời màn làm bài/kết quả, về lại danh sách Bài tập".
- extendedWaitUntil:
    visible:
      id: "homework_screen"
    timeout: 30000
- takeScreenshot: HW-14_15-after-result-close

# --- Xác nhận vẫn ĐÚNG assignment (card vẫn tồn tại, giờ đã hoàn thành) ---
# ĐÃ SỬA (2026-08-13, real device evidence thật, fixture "G3-U19-L3: Listen and choose"): SAU khi
# hoàn thành, card KHÔNG còn dòng "Hạn nộp DATE" nữa - layout đổi hẳn sang dạng "card đã hoàn
# thành" (badge "Điểm"/<số> phía TRÊN title, dòng "N/M" + "Điểm <số>" + "Xem bài đã làm" phía
# DƯỚI title, nút "Làm lại" thay cho "Làm bài"/"Tiếp tục") - đã xác nhận qua hierarchy dump thật
# TRƯỚC/SAU hoàn thành (scrollUntilVisible neo "Hạn nộp ${EXERCISE_DUE_DATE_DM}" FAILED thật ở
# bước này, trong khi neo theo title vẫn tìm thấy ngay). Vì vậy khối này LUÔN neo theo title
# (bỏ hẳn nhánh due-date) - KHÔNG áp dụng cho các bước TRƯỚC khi hoàn thành phía trên (due date
# vẫn còn nguyên lúc đó, đã verify thật, không đổi).
- scrollUntilVisible:
    element:
      text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
    direction: DOWN
    timeout: 90000
    speed: 70
    waitToSettleTimeoutMs: 500
- takeScreenshot: HW-14_15-card-completed

# --- PROGRESS_AFTER: xác nhận card đã chuyển sang trạng thái HOÀN THÀNH - KHÁC với thanh tiến độ
# TỔNG "Bài tập X/Y" đọc ở khối dưới đây (đã có sẵn từ trước).
#
# ĐÃ SỬA (2026-08-13, real device evidence thật): KHÔNG dùng dòng "N/M" làm tín hiệu hoàn thành -
# đã xác nhận thật dòng này mang 2 Ý NGHĨA KHÁC NHAU tuỳ thời điểm dù CÙNG VỊ TRÍ trên card: TRƯỚC
# khi làm, "N/M" = số câu ĐÃ TRẢ LỜI/tổng số câu (vd "0/1" = chưa làm câu nào). SAU khi hoàn thành,
# "N/M" ở CÙNG vị trí đó lại là số câu ĐÚNG/tổng số câu (vd "0/1" = đã làm nhưng đúng 0/1 câu) -
# tái hiện thật với fixture "G3-U19-L3: Listen and choose" (1 câu CONNECT, dispatcher chỉ nối cặp
# không quan tâm đúng/sai nên ra kết quả đúng 0/1): CẢ 2 LẦN ĐỌC ĐỀU RA CHUỖI "0/1" GIỐNG HỆT NHAU
# dù bản chất khác hẳn - nếu chỉ so sánh số (before.n < after.n) sẽ báo SAI là "không tăng" dù bài
# ĐÃ THẬT SỰ hoàn thành. Tín hiệu đáng tin cậy hơn (đã xác nhận thật qua hierarchy dump): dòng
# "Điểm <số>" (1 node hợp nhất, đứng NGAY SAU dòng N/M, phía DƯỚI title) - dòng này CHỈ xuất hiện
# trên card ĐÃ hoàn thành, card CHƯA làm không có dòng này ở bất kỳ đâu (đã xác nhận cả 2 chiều
# trước/sau bằng hierarchy dump thật). Regex tách biệt với badge điểm số phía TRÊN title (badge đó
# là 2 node RIÊNG "Điểm" và "<số>", không khớp regex "Điểm\s*[\d.,]+" gộp 1 dòng).
- copyTextFrom:
    text: ".*Điểm\\s*[0-9.,]+.*"
    below:
      text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
- runScript: ../../test_data/hw_fullluong_save_after_card_progress.js
- runScript: ../../test_data/hw_fullluong_compare_card_progress.js
- assertTrue: ${output.cardProgressOk}
- takeScreenshot: HW-14_15-progress-after

# --- Cuộn về đầu danh sách để đọc lại thanh tiến độ tổng "Bài tập X/Y" SAU khi hoàn thành ---
# Bước xác nhận card ở trên đã cuộn XUỐNG sâu để tìm card - header tiến độ (đầu danh sách) đang bị
# khuất, PHẢI cuộn về đầu trước khi copyTextFrom (cùng lý do bug đã xác nhận thật, xem comment đầu
# flow). swipe direction: DOWN = cuộn NGƯỢC lên đầu danh sách (cùng cơ chế
# flows/helpers/open-tab-homework.yaml dùng cho nhánh DEVICE_MODE=true).
- repeat:
    times: 5
    commands:
      - swipe:
          direction: DOWN
          duration: 250
- extendedWaitUntil:
    visible:
      text: ".*(Bài tập về nhà|Bài tập nâng cao).*"
    timeout: 15000
# ĐÃ SỬA (2026-08-12) - cùng lý do đã sửa ở copyTextFrom đầu flow (anchor "Bài tập" trùng cả tab
# bar dưới cùng, trả về chuỗi rỗng dù đang đúng đầu danh sách) - đổi sang anchor "2 tuần gần
# nhất"/"1 tháng gần nhất" (unique).
- copyTextFrom:
    below: ".*(2 tuần gần nhất|1 tháng gần nhất).*"
    above: "Bài tập về nhà"
- runScript: ../../test_data/hw_fullluong_save_after_progress.js
- runScript: ../../test_data/hw_fullluong_compare_progress.js
- assertTrue: ${output.progressOk}
- takeScreenshot: HW-14_15-progress-increased
