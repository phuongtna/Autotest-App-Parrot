# Testcase (nguồn/spec) cho module "Bài tập" (Homework) - màn Xem chi tiết 1 lần làm
# (AttemptReview) + popup "Giải thích" (Explanation). Theo cùng vai trò với
# flows/vui_hoc/testcases/unit9-getting-started.yaml: đây là spec NGUỒN để người/AI đối chiếu khi
# viết/verify automation.
#
# ĐÃ VERIFY THẬT trên thiết bị (2026-08-07, thiết bị 3201d866d40a1681, model "SM-M205G", app
# com.inet.parrotedu, tài khoản học sinh "Ngoc" lớp 3B - homework "G3-U18-Lesson 1: Listen and
# choose", Lần 4, "Đúng 2/5") - toàn bộ flow S01->S03->next dưới đây, cả 2 nhánh ĐÚNG/SAI, PASS
# 100% đúng như mô tả nghiệp vụ ban đầu, TRỪ 2 điểm text đã SỬA lại theo đúng chữ thật hiển thị
# trên app (không phải suy đoán/lỗi đánh máy khi viết spec lần đầu):
#   - Tiêu đề popup thật là "Parrot giải thích" (chữ "giải" viết THƯỜNG, không phải "Giải thích"
#     viết hoa như mô tả gốc).
#   - Mục thứ 2 của case ĐÚNG thật là "Tóm lại" (KHÔNG phải "Tóm tắt").
#
# Cũng đã xác định thêm (chưa biết trước khi verify):
#   - Cách nhận biết 1 câu ĐÚNG/SAI trước khi bấm "Giải thích": tab "Câu N" ở đầu màn AttemptReview
#     đổi màu theo câu đó - NỀN/VIỀN XANH LÁ = đã trả lời đúng, NỀN/VIỀN ĐỎ (hồng) = đã trả lời sai
#     (tab đang chọn có viền đậm hơn, không đổi ý nghĩa màu). Khớp đúng số "Đúng 2/5" của lần làm.
#   - Nút đóng popup: "Đóng" (nút xanh full-width ở đáy bottom sheet, KHÔNG phải icon X/tap ra
#     ngoài).
#   - Popup là 1 bottom sheet (kéo lên từ dưới), che phần trên vẫn thấy mờ mờ câu hỏi phía sau.
#
# Nguồn tham chiếu liên quan: automation/bai_tap/navigation/homeworkPageObjects.js (`reviewDetail`)
# + automation/bai_tap/navigation/homeworkNavigationEngine.js (`openAttemptDetail()`).

name: BaiTap_XemBaiDaLam_XemChiTiet_GiaiThich

precondition:
  tab: Bài tập
  homework: Đã hoàn thành ít nhất 1 lần (CTA "Làm lại"), có sẵn lịch sử làm bài để chọn

flow:

  - id: S01
    screen: Danh sách Bài tập
    action:
      button: Xem bài đã làm
    expected:
      screen: Lịch sử làm bài (danh sách các lần đã làm - "Lần 1", "Lần 2"...)

  - id: S02
    screen: Lịch sử làm bài
    action:
      chọn: 1 lịch sử làm bài bất kỳ (1 "Lần N" bất kỳ trong danh sách)
      button: Xem chi tiết
    expected:
      screen: Xem chi tiết (hiển thị lại Câu 1 của lần làm đã chọn)

  - id: S03
    screen: Xem chi tiết - từng câu (Câu 1..N)
    note: >
      Lặp lại bước này cho mỗi câu trong lần làm đã chọn, tới khi nút chuyển câu đổi thành
      "Xem xong" ở câu cuối (theo đúng cơ chế đã verify thật trong openAttemptDetail()). Xác định
      câu ĐÚNG/SAI qua màu tab "Câu N" (xanh lá = đúng, đỏ/hồng = sai) - xem ghi chú đầu file.
    attempts:

      - condition: Câu trả lời ĐÚNG (tab "Câu N" nền/viền xanh lá)
        action:
          button: Giải thích
        expected:
          popup: Parrot giải thích
          sections:
            - Kiến thức
            - Tóm lại

      - condition: Câu trả lời SAI (tab "Câu N" nền/viền đỏ/hồng)
        action:
          button: Giải thích
        expected:
          popup: Parrot giải thích
          sections:
            - Kiến thức
            - Tại sao sai
            - Gợi ý

    closePopup:
      button: Đóng

    next:
      - button: Tiếp theo
        condition: Còn câu tiếp theo (chưa phải câu cuối)
        expected:
          screen: Xem chi tiết - câu kế tiếp

      - button: Xem xong
        condition: Đang ở câu cuối cùng (thay cho "Tiếp theo")
        expected:
          screen: Lịch sử làm bài (quay về màn danh sách các lần đã làm)

result:

  verify:

    - id: V01
      mô_tả: Popup "Giải thích" luôn hiển thị đúng tiêu đề "Parrot giải thích".
      trạng_thái: PASS (verify thật 2026-08-07, cả Câu 1 đúng và Câu 3 sai)

    - id: V02
      mô_tả: >
        Câu trả lời ĐÚNG -> popup chỉ có 2 mục "Kiến thức" và "Tóm lại" (KHÔNG có
        "Tại sao sai"/"Gợi ý").
      trạng_thái: PASS (verify thật 2026-08-07, Câu 1 - "What's Tom doing?")

    - id: V03
      mô_tả: Câu trả lời SAI -> popup có đủ 3 mục "Kiến thức", "Tại sao sai", "Gợi ý".
      trạng_thái: PASS (verify thật 2026-08-07, Câu 3 - "How old is Tommy's brother?")

    - id: V04
      mô_tả: >
        Bấm "Tiếp theo" (khi còn câu sau) -> điều hướng đúng sang Xem chi tiết của câu kế tiếp,
        không bỏ sót/lặp câu.
      trạng_thái: PASS (verify thật 2026-08-07, Câu 3 -> Câu 4 -> Câu 5, đúng thứ tự 3/5 -> 4/5 -> 5/5)

    - id: V05
      mô_tả: >
        Bấm "Xem xong" (chỉ xuất hiện ở câu cuối) -> quay về đúng màn Lịch sử làm bài, không mất
        trạng thái danh sách.
      trạng_thái: PASS (verify thật 2026-08-07, tại Câu 5/5 nút tự đổi "Tiếp theo" -> "Xem xong",
        bấm vào quay về đúng danh sách "Lần 4"/"Lần 3"/"Lần 2" như trước khi vào Xem chi tiết)
