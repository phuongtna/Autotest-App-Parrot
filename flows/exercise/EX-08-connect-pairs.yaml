# EX-08 — Câu NỐI (CONNECT) trên CẢ HAI màn có câu nối.
#
# CHẠY ĐƯỢC TRÊN MỌI BẢN BUILD, kể cả bản đẩy store.
#
# Màn 1 — tab "Bài tập":  app/dashboard/exercise/doing.tsx
# Màn 2 — màn "Vui học":  app/dashboard/learning/unit/[id].tsx
#
# Hai màn render HAI biến thể khác nhau, quyết định bởi 1 dòng:
#   LessonExerciseContent.tsx:692
#   const isConnectV2 = enableCheckAnswer === false && type === "CONNECT";
#
#   |                   | Bài tập             | Vui học             |
#   |-------------------|---------------------|---------------------|
#   | enableCheckAnswer | false (truyền tay)  | true (mặc định)     |
#   | component         | ConnectAnswerListV2 | ConnectAnswerList   |
#   | cặp sai           | vẫn giữ             | bị bỏ ngay          |
#   | footer hiện khi   | nối kín hết ô       | nối ĐÚNG hết        |
#
# CÁCH XỬ LÝ CŨ (đã bỏ): build bật EXPO_PUBLIC_E2E=1 để ô cột phải mang hậu tố
# "_for_left_{i}" chỉ thẳng cặp đúng. Cờ đó đã bị BỎ HẲN vì chỉ cần nó lọt vào
# một lệnh build là bản đẩy store lộ đáp án — xem constants/e2e.ts.
#
# CÁCH XỬ LÝ HIỆN TẠI, không cần biết đáp án:
#   - Bài tập (V2, giữ cả cặp sai)  -> nối kín hết ô theo vị trí là đủ
#     (helpers/solve-connect-fill.yaml)
#   - Vui học (v1, bỏ cặp sai ngay) -> ĐO bằng phản hồi của app: quét lần lượt
#     mỗi ô phải cho từng ô trái; cặp đúng dính lại, cặp sai bị bỏ nên không làm
#     bẩn trạng thái -> hội tụ mà không cần đáp án
#     (helpers/solve-connect-bruteforce.yaml)
#
# Tham số tuỳ chọn:
#   EXERCISE_NAME_CONNECT — tên bài ở tab Bài tập để mở (mặc định "Read and choose")
#   VUIHOC_LESSON_INDEX   — card bài học thứ mấy trên màn Vui học (mặc định 0)
appId: ${APP_ID}
tags:
  - regression
  - writes
name: EX-08 Noi cap - Bai tap va Vui hoc
---
- runFlow:
    file: ../helpers/open-exercise.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
      EXERCISE_NAME: ${EXERCISE_NAME_CONNECT}

# ============================================================
# PHẦN A — tab "Bài tập" (ConnectAnswerListV2)
# ============================================================
- runFlow:
    file: ../helpers/goto-question-type.yaml
    env:
      TARGET_ID: "exercise_connect_left_0"
      TYPE_LABEL: "NOI (CONNECT)"

- assertVisible:
    id: "exercise_connect_right_0"
    label: "Cau NOI khong co o cot phai nao. Sai du lieu de - bao dev."

# V2 giữ cả cặp sai nên chỉ cần nối kín hết ô theo vị trí.
- runFlow: ../helpers/solve-connect-fill.yaml

# Nối kín hết ô -> CheckAnswerFooter nhánh isConnectV2AllMatched hiện nút "Tiếp tục".
# V2 KHÔNG render nhãn đúng/sai nên chỉ chốt tới đây.
- extendedWaitUntil:
    visible:
      id: "exercise_check_button"
    timeout: 20000
- takeScreenshot: ../artifacts/EX-08-connect-baitap

# Thoát bài để không mang state sang phần B
- tapOn:
    id: "exercise_close_button"
- extendedWaitUntil:
    visible:
      id: "homework_screen"
    timeout: 30000

# ============================================================
# PHẦN B — màn "Vui học" (ConnectAnswerList v1)
# ============================================================
- runFlow:
    file: ../helpers/open-vuihoc-connect.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
      VUIHOC_LESSON_INDEX: ${VUIHOC_LESSON_INDEX}

- assertVisible:
    id: "exercise_connect_left_0"
    label: "KHONG TIM DUOC CAU NOI o man Vui hoc. BLOCKED - doi bai hoc qua VUIHOC_LESSON_INDEX."

# Nối hết các cặp bằng cách ĐO PHẢN HỒI CỦA APP, không cần biết đáp án: màn
# Vui học (v1) bỏ cặp sai ngay và giữ cặp đúng, nên quét lần lượt mỗi ô phải
# cho từng ô trái sẽ hội tụ. Chậm hơn đường cũ (tối đa 36 cặp) nhưng không đòi
# hỏi bất kỳ thông tin đáp án nào trong build.
- runFlow: ../helpers/solve-connect-bruteforce.yaml

# v1: nối đúng hết -> isConnectAllMatched -> auto-check -> footer báo thành công.
# Chốt được cả nhãn kết quả, mạnh hơn phần A.
- extendedWaitUntil:
    visible:
      id: "exercise_result_correct"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "exercise_check_button"
    timeout: 20000
- takeScreenshot: ../artifacts/EX-08-connect-vuihoc

- tapOn:
    id: "learning_close_button"
    optional: true
