# Dispatcher: nhan dien TYPE cua CAU HIEN TAI tren man lam bai va goi dung handler, lap lai toi
# da 25 lan de tien den man ket qua.
#
# KHONG kiem tra dung/sai (viec do la trach nhiem cua EX-01..EX-09) - chi thao tac AN TOAN de
# chuyen sang cau tiep theo. Moi nhanh CHOICE/FILL_WORD/CONNECT ben duoi COPY NGUYEN logic da
# verify that trong flows/exercise/EX-10-full-run-all-correct.yaml (khong viet lai cach khac) -
# testID lay tu flows/exercise/README.md. KHONG doi behavior cua cac nhanh CONFIRMED nay.
#
# THAM SO (tuy chon, khong bat buoc - chi de lam giau BLOCKED report, khong anh huong happy path):
#   EXERCISE_NAME - ten assignment dang lam, do caller (vd ktra_fullluong_lambai.yaml) truyen
#   vao neu co. Khong truyen van chay binh thuong (dung nhanh null-coalescing da la idiom co san
#   trong repo - xem flows/helpers/open-exercise.yaml).
#
# KIEN TRUC (dispatcher, detect TUNG CAU tai thoi diem xu ly - KHONG gia dinh ca bai chi co 1
# type, KHONG gia dinh cau dau tien thuoc type nao):
#
#   detect cau hien tai
#         |
#         +-- text "Nhan de noi"            -> SPEAK    -> answer-speak-question.yaml
#         +-- id exercise_fillword_input    -> FILL_WORD -> (inline, xem duoi)
#         +-- id exercise_connect_left_0    -> CONNECT   -> (inline, xem duoi)
#         +-- text "Reorder the letters"    -> SORT / SENTENCE_BUILDER (ambiguous - khong phan
#         |                                    biet duoc qua UI, xem 2 file handler) -> BLOCKED_
#         |                                    MISSING_UI_EVIDENCE (handler tu bao, khong phai
#         |                                    dispatcher doan type)
#         +-- id exercise_dragdrop_options  -> DRAG_DROP -> answer-drag-drop-question.yaml
#         +-- id exercise_answer_{i}_*      -> TRUE_FALSE/ONE/MULTI (CHOICE) -> (inline, xem duoi)
#         |
#         +-- khong id/text nao o tren con hien sau khi da thu het cac nhanh tren, VA cung
#             khong phai man ket qua/nut Kiem tra (nghia la THAT SU khong nhan dien duoc gi)
#                   |
#                   +-- BLOCKED_MISSING_EXERCISE_HANDLER ngay lap tuc (KHONG cho chay het 25
#                       lan lap, KHONG cho fail o timeout 60-90s cho exercise_result_screen o
#                       tang goi - xem muc "Unknown-type guard" o cuoi file)
#
# SORT/SENTENCE_BUILDER: van KHONG tu dong hoa duoc thao tac that (2 type dung chung 1 tin hieu
# UI, khong phan biet duoc - xem audit trong flows/helpers/answer-sort-question.yaml,
# answer-sentence-builder-question.yaml).
#
# DRAG_DROP: DA CONFIRMED that (2026-08-12, xem flows/helpers/answer-drag-drop-question.yaml) -
# testID exercise_dragdrop_zone_{i}/exercise_dragdrop_options/exercise_dragdrop_option_{i} xac
# nhan qua maestro hierarchy that (fixture Khoi 7/Unit 12/Grammar/"A/ An"). PHAT HIEN QUAN
# TRONG: KHONG can gesture keo - chi tapOn dung 1 option la tu dien vao cho trong. Day la thay
# doi so voi gia dinh cu (README.md muc 1, automation/bridge|runtime/handlers/dragDropHandler.js)
# rang DRAG_DROP can pan gesture that Maestro khong lam duoc - gia dinh do SAI it nhat voi bien
# the UI nay.
appId: ${APP_ID}
---
- repeat:
    times: 25
    commands:
      # SPEAK
      - runFlow:
          when:
            visible: ".*(Nhấn để nói).*"
          commands:
            - runFlow:
                file: answer-speak-question.yaml

      # FILL_WORD
      - runFlow:
          when:
            visible:
              id: "exercise_fillword_input"
          commands:
            - tapOn:
                id: "exercise_fillword_input"
            - inputText: "test"
            - tapOn:
                id: "exercise_fillword_check_button"
                optional: true
            - tapOn:
                id: "exercise_fillword_next_button"
                optional: true

      # CONNECT - testID chi mang VI TRI (xem flows/exercise/README.md muc 4: "id chi mang vi tri
      # trai i / phai i, cap dung do BE quyet dinh" - KHONG kiem dung/sai o day, khop dung tinh
      # than "Bai tap khong check dung sai nhu Vui hoc").
      #
      # DA SUA (2026-08-12): ban cu dung regex "left_.*"/"right_.*" lap 6 lan - LUON khop ve DUNG 1
      # index (element left_0/right_0 van con trong tree sau khi noi, chi doi trang thai hien thi,
      # khong bi go khoi tree, nen tapOn theo regex cu resolve lai ve match DAU TIEN) - DA GAP THAT
      # (random qua flows/giao_bai_tap chon "G3-U19-L3: Listen and choose" - "Listen and match", 5
      # cap): 4/5 cap con lai KHONG BAO GIO duoc noi, footer "Kiem tra" khong bao gio xuat hien.
      # SUA: noi theo DUNG index 0..9 (du du so voi so cap thuc te da gap, toi da 5 - xem
      # automation/giao_bai_tap discovery) - moi cap optional (index khong ton tai thi bo qua).
      - runFlow:
          when:
            visible:
              id: "exercise_connect_left_0"
          commands:
            - tapOn: { id: "exercise_connect_left_0", optional: true }
            - tapOn: { id: "exercise_connect_right_0", optional: true }
            - tapOn: { id: "exercise_connect_left_1", optional: true }
            - tapOn: { id: "exercise_connect_right_1", optional: true }
            - tapOn: { id: "exercise_connect_left_2", optional: true }
            - tapOn: { id: "exercise_connect_right_2", optional: true }
            - tapOn: { id: "exercise_connect_left_3", optional: true }
            - tapOn: { id: "exercise_connect_right_3", optional: true }
            - tapOn: { id: "exercise_connect_left_4", optional: true }
            - tapOn: { id: "exercise_connect_right_4", optional: true }
            - tapOn: { id: "exercise_connect_left_5", optional: true }
            - tapOn: { id: "exercise_connect_right_5", optional: true }
            - tapOn: { id: "exercise_connect_left_6", optional: true }
            - tapOn: { id: "exercise_connect_right_6", optional: true }
            - tapOn: { id: "exercise_connect_left_7", optional: true }
            - tapOn: { id: "exercise_connect_right_7", optional: true }
            - tapOn: { id: "exercise_connect_left_8", optional: true }
            - tapOn: { id: "exercise_connect_right_8", optional: true }
            - tapOn: { id: "exercise_connect_left_9", optional: true }
            - tapOn: { id: "exercise_connect_right_9", optional: true }

      # SORT / SENTENCE_BUILDER (ambiguous - xem docblock dau file + 2 handler skeleton). Dat
      # TRUOC nhanh CHOICE de assertVisible BLOCKED ben trong handler duoc uu tien kich hoat ngay
      # (assertion fail se dung ca flow tai day, cac buoc CHOICE/check_button phia duoi se KHONG
      # chay tiep trong iteration nay - dung y muon, tranh tap nham vao man Sentence Builder).
      - runFlow:
          when:
            visible: ".*(Reorder the letters).*"
          commands:
            - runFlow:
                file: answer-sort-question.yaml
                env:
                  EXERCISE_NAME: ${EXERCISE_NAME}

      # DRAG_DROP - CONFIRMED (xem answer-drag-drop-question.yaml). testID chi mang VI TRI
      # (option_{i}), khong gan voi noi dung - tong quat hoa duoc cho bat ky tu/cau nao.
      - runFlow:
          when:
            visible:
              id: "exercise_dragdrop_options"
          commands:
            - runFlow:
                file: answer-drag-drop-question.yaml

      # CHOICE (ONE / MULTI / TRUE_FALSE) - DA SUA (2026-08-13, real-device evidence): id
      # "exercise_answer_{i}_correct" KHONG TON TAI tren build hien tai (xac nhan that qua ~17 lan
      # tapOn optional deu WARNED khi chay ktra_fullluong_lambai.yaml, xem step-069..298 trong
      # ~/.maestro/tests/2026-08-13_093844/.../screen-hierarchy/ + doc chi tiet trong
      # flows/exercise/EX-01-answer-correct.yaml). Id THAT tren build nay la id PHANG, khong mang
      # thong tin dung/sai: exercise_answer_0/exercise_answer_1 (vd TRUE_FALSE: "True"/"False").
      # QUAN TRONG: nut exercise_check_button ("Tiep theo") DISABLED cho toi khi it nhat 1 dap an
      # duoc chon - ban cu (toan bo 6 tap deu no-op vi id khong ton tai) bam vao nut dang disable
      # nen KHONG BAO GIO tien duoc qua cau 1 (da tai hien that: 17 lan lap deu quay lai dung 1
      # cau). Doi sang tap theo VI TRI PHANG (khong quan tam dung/sai, dung tinh than nhanh CONNECT
      # o tren - "Bai tap khong check dung sai") de dam bao co >=1 dap an duoc chon, nut duoc bat.
      - tapOn:
          id: "exercise_answer_0"
          optional: true
      - tapOn:
          id: "exercise_answer_1"
          optional: true
      - tapOn:
          id: "exercise_answer_2"
          optional: true
      - tapOn:
          id: "exercise_answer_3"
          optional: true
      - tapOn:
          id: "exercise_answer_4"
          optional: true
      - tapOn:
          id: "exercise_answer_5"
          optional: true

      # Kiem tra -> Tiep tuc / Thu lai / Hoan thanh (cung 1 nut, bam 2 lan cho du chu ky)
      - tapOn:
          id: "exercise_check_button"
          optional: true
      - tapOn:
          id: "exercise_check_button"
          optional: true

      # --- Unknown-type guard (MOI) ---
      # Neu SAU KHI da thu het moi nhanh tren, man hinh hien tai KHONG con bat ky tin hieu nao
      # trong danh sach da biet (id CHOICE/FILL_WORD/CONNECT, id nut Kiem tra, id man Ket qua, text
      # SPEAK/SORT-SENTENCE_BUILDER) - day la 1 type THAT SU chua co handler nao detect duoc (khac
      # voi nhanh SORT/SENTENCE_BUILDER o tren, noi dispatcher VAN detect duoc candidate type qua
      # text roi moi bao BLOCKED_MISSING_UI_EVIDENCE ben trong handler). Bao
      # BLOCKED_MISSING_EXERCISE_HANDLER NGAY tai day - KHONG cho repeat chay tiep het 25 lan,
      # KHONG de flow "chay mai" roi moi fail o timeout 60-90s cho exercise_result_screen o tang
      # goi (day chinh la van de repo tung mac phai truoc khi co dispatcher nay).
      #
      # Ky thuat: notVisible long nhau (2 lop) - dung LAI dung idiom da verify that trong
      # flows/helpers/answer-speak-question.yaml (dong 55-65: runFlow.when.notVisible de phat hien
      # "khong thay dieu mong doi" roi assertVisible bao loi co message ro rang). KHONG dung cu
      # phap when ket hop nhieu key (vd {visible: A, notVisible: B} cung 1 block) vi repo chua tung
      # dung/verify cu phap do - tach thanh 2 lop notVisible doc lap, moi lop dung dung 1 key nhu
      # moi noi khac trong repo.
      - runFlow:
          when:
            notVisible:
              id: "exercise_fillword_input|exercise_connect_left_0|exercise_answer_.*|exercise_dragdrop_options|exercise_check_button|exercise_result_screen"
          commands:
            - runFlow:
                when:
                  notVisible: ".*(Nhấn để nói|Reorder the letters).*"
                commands:
                  - takeScreenshot: BLOCKED-missing-exercise-handler-dispatcher
                  - assertVisible:
                      text: "BLOCKED_MISSING_EXERCISE_HANDLER - khong nhan dien duoc type cua cau hoi hien tai - detected_signals: khong co id/text nao trong danh sach da biet (exercise_fillword_input, exercise_connect_left_0, exercise_answer_*, exercise_dragdrop_options, exercise_check_button, exercise_result_screen, Nhan de noi, Reorder the letters) - candidate_type: chua xac dinh duoc, can doc hierarchy that de bo sung nhanh detect moi - missing_handler: chua co - exercise: ${EXERCISE_NAME == null ? 'khong ro, EXERCISE_NAME khong duoc truyen vao helper nay' : EXERCISE_NAME}"
