#
# CONTRACT: goi tu dispatcher (flows/helpers/answer-current-exercise-generic.yaml) hoac truc
# tiep tu 1 EX testcase, khi man hinh hien tai da duoc dispatcher xac nhan la dang
# "ghep/sap xep chu cai" (tin hieu DUY NHAT tung quan sat duoc: text "Reorder the letters" -
# xem automation/README.md dong 604-612, flows/exercise/README.md muc 1).
#
# QUAN TRONG - AMBIGUOUS VOI SENTENCE_BUILDER: text "Reorder the letters" la tin hieu DUY NHAT
# ma repo tung ghi nhan cho CA SORT lan SENTENCE_BUILDER (xem
