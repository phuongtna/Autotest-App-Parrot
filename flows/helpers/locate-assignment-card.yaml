# Helper: xác nhận NATIVE (Maestro tự cuộn BÊN TRONG 1 lần gọi CLI) rằng card
# (TARGET_TITLE, Hạn nộp TARGET_DUE_DATE_DM) đang hiển thị trên tab Bài tập - KHÔNG bấm gì (chỉ
# verify tồn tại + đúng cặp title/due date, không mở bài).
#
# TẠI SAO: đã ĐO THẬT trên thiết bị (3201d866d40a1681, 2026-08-12, xem docblock
# TARGET_LOOKUP_* trong flows/homework/verify-filter-web-vs-app.mjs) rằng MỖI lệnh CLI
# `maestro` (dù `hierarchy` hay `test` 1 flow nhỏ) tốn ~52-67s - chi phí gần như CỐ ĐỊNH do
# khởi động lại process/ADB, KHÔNG phụ thuộc việc cuộn bao nhiêu lần. Vòng cũ (swipe ngoài ->
# `maestro hierarchy` -> parse -> swipe tiếp) trả giá ~55-60s cho MỖI lượt cuộn. `scrollUntilVisible`
# native cuộn NHIỀU lần bên trong CÙNG 1 lần gọi CLI đó - cùng chi phí ~55-90s nhưng cuộn được
# sâu hơn nhiều (Maestro tự lặp scroll+check nội bộ, không phải round-trip CLI riêng từng lượt).
#
# Neo theo "Hạn nộp DD/MM" (KHÔNG theo title) - COPY NGUYÊN cơ chế ĐÃ VERIFY trong
# flows/helpers/open-exercise.yaml (dòng scrollUntilVisible theo "Hạn nộp ${EXERCISE_DUE_DATE_DM}")
# - không invent selector mới. Lý do: title có thể trùng ≥2 card (bài cũ quá hạn + bài mới giao
# lại cùng tên - ĐÃ GẶP THẬT) nhưng "Hạn nộp DD/MM" cụ thể thường chỉ ứng với ĐÚNG 1 trong số đó.
# assertVisible ngay sau đó xác nhận card tại vị trí vừa cuộn tới ĐÚNG là title mong đợi (không
# phải 1 assignment KHÁC vô tình cùng hạn nộp) - vẫn giữ nguyên business rule (title + due date),
# chỉ đổi CÁCH TÌM.
#
# LƯU Ý: helper này KHÔNG tự phân biệt được "2 card giống hệt title+due date cùng tồn tại"
# (Maestro không có "đếm số match" - xem BLOCKED_AMBIGUOUS_MATCH) - caller
# (flows/giao_bai_tap/e2e-teacher-assign-student-open.mjs) làm việc đó bằng ĐÚNG 1 lệnh
# `maestro hierarchy` SAU KHI helper này đã xác nhận tìm thấy (không phải sau mỗi lượt cuộn).
#
# Tham số: PHONE, OTP, TARGET_TITLE, TARGET_DUE_DATE_DM ("DD/MM"), SWITCH_TO_MONTH_FILTER
#   ("true"/"false" - caller tự tính bằng computeRange()/inRange() đã có, xem
#   flows/homework/verify-filter-web-vs-app.mjs - helper này không tự tính lại business rule ngày).
appId: ${APP_ID}
---
- runFlow: launch-keep-session.yaml
- runFlow:
    file: login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: open-tab-homework.yaml

# Đổi filter sang "1 tháng gần nhất" NẾU caller đã xác định Hạn nộp nằm ngoài "2 tuần gần nhất" -
# gộp vào CHÍNH flow này (không phải 1 lệnh `maestro test` riêng) để đỡ tốn thêm 1 lần khởi động
# CLI (~55-60s) cho việc đổi filter.
- runFlow:
    when:
      true: ${SWITCH_TO_MONTH_FILTER == 'true'}
    commands:
      - tapOn:
          text: ".*gần nhất.*"
      - extendedWaitUntil:
          visible: ".*(Xem bài tập theo).*"
          timeout: 10000
      - runFlow: homework-select-month-filter.yaml

# ĐÃ SỬA (2026-08-14, xác nhận thật qua run lỗi thật, 3 lượt): "maestro test" FAILED "No visible
# element found: Hạn nộp 21/08" dù card THẬT SỰ tồn tại - xác nhận bằng tay qua uiautomator dump +
# swipe tăng dần: card nằm ở khoảng lượt cuộn thứ 12 (~5-6 màn hình, danh sách 34 bài không sắp
# xếp chặt theo Hạn nộp - nhiều card TRÙNG HỆT title+due date chen giữa, vd 2 card liền nhau
# "G3-U1-Lesson 1: Listen and repeat" / "Hạn nộp 20/08"). Thêm waitToSettleTimeoutMs (500ms,
# lượt sửa đầu) KHÔNG đủ - screenshot debug (step-018) cho thấy Maestro dừng lại NGAY TRƯỚC card
# mục tiêu, đúng tại cụm card trùng lặp đó: nghi cơ chế phát hiện "cuộn không còn tiến triển" của
# scrollUntilVisible (so sánh hierarchy giữa 2 lượt cuộn) bị đánh lừa bởi nội dung text trùng lặp
# liên tiếp, tưởng đã chạm đáy danh sách nên dừng sớm dù còn card thật ở dưới. Tăng `speed` (40 ->
# 70) để mỗi lượt cuộn đi xa hơn, vượt qua cụm trùng lặp nhanh hơn trước khi cơ chế đó kích hoạt.
#
# ĐÃ SỬA LẦN 2 (2026-08-14, root cause thật xác nhận qua run mới, room_id=a1b4e34a-9313-4895-8b10-
# 52731880d01a, title "G3-U2-Lesson 2: Listen and repeat", due 21/08): tăng speed vẫn KHÔNG đủ - 2
# lượt native locate ĐỘC LẬP đều FAILED y hệt "No visible element found: Hạn nộp 21/08", nhưng
# screen-hierarchy chụp NGAY TẠI FRAME FAILED (step-018, CẢ 2 lượt) xác nhận card mục tiêu (đúng
# title, đúng "Hạn nộp 21/08" ngay dưới title) đang hiển thị ĐẦY ĐỦ, không che, không disable - lý
# do FAILED là có 1 card KHÁC cũng "Hạn nộp 21/08" nằm ngay tiếp theo bên dưới (mọi room test tự
# động trong ngày đều mặc định dueDate=hôm nay+N giống nhau nên due-date THEO BẢN CHẤT không unique,
# khác hẳn title). ĐỔI CHIẾN LƯỢC: SCROLL TARGET = TITLE (title không bị lặp liên tiếp kiểu này),
# due-date CHỈ còn dùng để VERIFY đúng card SAU KHI title đã visible (assertVisible, không phải
# target scroll nữa) - nếu verify FAILED ở đây, nghĩa là title vừa cuộn tới KHÔNG phải card đúng
# hạn nộp mong đợi (vd trùng title với 1 card cũ khác hạn nộp) - caller tự quyết định BLOCKED, đây
# không tự đoán/thử lại. Giữ nguyên speed 70 (đã xác minh có tác dụng thật), tăng timeout 90000 ->
# 150000 (đồng bộ với flows/helpers/open-exercise.yaml, danh sách đã dài thêm qua nhiều lần chạy).
- scrollUntilVisible:
    element:
      text: "${TARGET_TITLE}"
    direction: DOWN
    timeout: 150000
    speed: 70
    waitToSettleTimeoutMs: 500

- assertVisible:
    text: "Hạn nộp ${TARGET_DUE_DATE_DM}"
    below:
      text: "${TARGET_TITLE}"
