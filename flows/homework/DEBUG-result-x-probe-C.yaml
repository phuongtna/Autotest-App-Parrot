# DEBUG PROBE C (tạm, xoá sau khi xong) - verify lại ĐÚNG đoạn bị sửa: result screen -> tap X ->
# chờ "homework_screen" (thay vì regex "Bài tập" mơ hồ) -> về danh sách. Dùng 1 bài KHÔNG phải
# SPEAK (Read and complete) để không tốn ~8 phút chấm điểm phát âm như lần probe A/B trước.
appId: ${APP_ID}
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml
- runFlow:
    file: ../helpers/open-exercise.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
      DEVICE_MODE: "true"
      EXERCISE_NAME: "G3-U1-Lesson 2: Read and complete"
- runFlow: ../helpers/answer-current-exercise-generic.yaml
- extendedWaitUntil:
    visible:
      id: "exercise_result_screen"
    timeout: 60000
- takeScreenshot: DEBUG-probeC-result-screen

# --- Đoạn ĐÃ SỬA, đúng nguyên bản trong ktra_fullluong_lambai.yaml ---
- runFlow:
    when:
      visible: "Hoàn thành"
    commands:
      - tapOn:
          text: ".*(Hoàn thành).*"
- runFlow:
    when:
      visible: "Tiếp theo"
    commands:
      - tapOn:
          point: "92%,6%"
- extendedWaitUntil:
    visible:
      id: "homework_screen"
    timeout: 30000
- takeScreenshot: DEBUG-probeC-back-to-list
