# DEBUG PROBE D (tạm, xoá sau khi xong) - probe C chọn nhầm "G3-U1-Lesson 2: Read and complete"
# (câu đầu là Reorder the letters - dạng SORT/drag chưa tự động hoá được, xem README.md mục 1).
# Đổi sang "G3-U18-Lesson 1: Listen and repeat" (đã verify chạy được hết bằng generic handler ở
# probe A/B, dạng SPEAK) - dùng "Làm lại" vì bài này đã hoàn thành trước đó.
appId: ${APP_ID}
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml
- runFlow:
    file: ../helpers/open-exercise.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
      DEVICE_MODE: "true"
      EXERCISE_NAME: "G3-U18-Lesson 1: Listen and repeat"
- runFlow: ../helpers/answer-current-exercise-generic.yaml
- extendedWaitUntil:
    visible:
      id: "exercise_result_screen"
    timeout: 60000
- takeScreenshot: DEBUG-probeD-result-screen

# --- Đoạn ĐÃ SỬA, đúng nguyên bản trong ktra_fullluong_lambai.yaml ---
- runFlow:
    when:
      visible: "Hoàn thành"
    commands:
      - tapOn:
          text: ".*(Hoàn thành).*"
- runFlow:
    when:
      visible: "Tiếp theo"
    commands:
      - tapOn:
          point: "92%,6%"
- extendedWaitUntil:
    visible:
      id: "homework_screen"
    timeout: 30000
- takeScreenshot: DEBUG-probeD-back-to-list
