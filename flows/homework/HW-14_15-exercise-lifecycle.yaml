# HW-14_15 — Lifecycle vòng đời làm bài của MỘT assignment cụ thể: mở ĐÚNG bài -> thoát giữa
# chừng bằng X (chưa trả lời câu nào) -> quay lại tab Bài tập -> xác nhận card đổi thành
# "Tiếp tục" -> bấm "Tiếp tục" resume ĐÚNG bài đó -> làm hết bằng exercise handler chung (không
# giả định loại câu hỏi) -> màn kết quả -> xác nhận card vẫn còn đúng bài (giờ đã hoàn thành).
#
# KHÁC bản gốc: KHÔNG còn chọn bài theo `tapOn: {text: ..., index: 0}` - PHẢI được gọi kèm tham số
# EXERCISE_NAME = title của 1 assignment CÓ THẬT (khớp chính xác text hiển thị trên card App HS).
# Không có EXERCISE_NAME thì dùng mặc định "Read and choose" (giống flows/helpers/open-exercise.yaml)
# - mặc định này CHỈ để chạy độc lập lúc dev/kiểm tra riêng cơ chế resume, KHÔNG chứng minh được
# "resume đúng bài GV vừa giao" (muốn chứng minh việc đó, xem
# flows/giao_bai_tap/e2e-teacher-assign-student-lifecycle.mjs - script đó giao bài thật qua Web GV
# rồi tự truyền EXERCISE_NAME=title vừa tạo vào flow này).
#
# EXERCISE_DUE_DATE_DM (optional, "DD/MM"): TRUYỀN KHI CÓ THỂ - nếu EXERCISE_NAME trùng title với
# ≥1 card khác (ĐÃ GẶP THẬT: 1 bài từng giao trước đó còn tồn tại quá hạn + bài mới cùng tên), neo
# theo "Hạn nộp DD/MM" (duy nhất hơn) thay vì theo title khi tìm lại card ở bước resume - xem cùng
# cơ chế trong flows/helpers/open-exercise.yaml.
#
# Nếu câu hỏi trong bài (bất kỳ câu nào, không chỉ câu đầu) là SPEAK (".*Nhấn để nói.*"): case này
# sẽ FAIL CÓ CHỦ ĐÍCH với thông báo chứa "BLOCKED_MISSING_EXERCISE_HANDLER" (xem
# flows/helpers/answer-current-exercise-generic.yaml) - repo hiện CHƯA có cách an toàn để vượt qua
# câu SPEAK trên route tab Bài tập (đã xác nhận thật: bấm mic trên thiết bị thật khiến app thoát ra
# ngoài, xem flows/exercise/README.md mục 2 + flows/exercise/EX-12-speaking-record-result.yaml).
# KHÔNG coi lỗi này là flaky - đây là giới hạn đã biết, cần handler riêng mới tự động hoá được.
appId: ${APP_ID}
tags:
  - writes
  - regression
name: HW-14_15 Lifecycle - mo dung bai, thoat X, resume dung bai, hoan thanh
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}

# --- Mở ĐÚNG assignment (không index 0 - open-exercise.yaml scroll+tap theo EXERCISE_NAME) ---
- runFlow:
    file: ../helpers/open-exercise.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
      EXERCISE_NAME: ${EXERCISE_NAME}
      EXERCISE_DUE_DATE_DM: ${EXERCISE_DUE_DATE_DM}
- takeScreenshot: ../artifacts/HW-14_15-opened

# --- Thoát ngay bằng X (chưa trả lời câu nào) ---
- tapOn:
    id: "exercise_close_button"
- extendedWaitUntil:
    visible: ".*(Bài tập).*"
    timeout: 20000

# --- Refresh để state doing_answer_id được nạp lại (pattern đã verify, giữ nguyên từ bản gốc) ---
- swipe:
    start: 50%, 35%
    end: 50%, 85%
    duration: 600
- extendedWaitUntil:
    visible:
      text: ".*(Bài tập về nhà|Bài tập nâng cao).*"
    timeout: 30000

# --- Tìm ĐÚNG card vừa thoát (không index), xác nhận CTA đã đổi "Tiếp tục", rồi bấm ĐÚNG nó ---
# Neo theo EXERCISE_DUE_DATE_DM (Hạn nộp DD/MM, duy nhất hơn) khi có, giống cơ chế
# flows/helpers/open-exercise.yaml - tránh bug đã gặp thật: title trùng ≥2 card (bài cũ quá hạn +
# bài mới cùng tên) khiến scrollUntilVisible/tapOn theo title không nhắm đúng.
- runFlow:
    when:
      true: ${EXERCISE_DUE_DATE_DM != null}
    commands:
      - scrollUntilVisible:
          element:
            text: "Hạn nộp ${EXERCISE_DUE_DATE_DM}"
          direction: DOWN
          timeout: 20000
      - assertVisible:
          text: "Tiếp tục"
          below:
            text: "Hạn nộp ${EXERCISE_DUE_DATE_DM}"
      - takeScreenshot: ../artifacts/HW-14_15-card-shows-tieptuc
      - tapOn:
          text: "Tiếp tục"
          below:
            text: "Hạn nộp ${EXERCISE_DUE_DATE_DM}"
- runFlow:
    when:
      true: ${EXERCISE_DUE_DATE_DM == null}
    commands:
      - scrollUntilVisible:
          element:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
          direction: DOWN
          timeout: 20000
      - assertVisible:
          text: "Tiếp tục"
          below:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
      - takeScreenshot: ../artifacts/HW-14_15-card-shows-tieptuc
      - tapOn:
          text: "Tiếp tục"
          below:
            text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
- runFlow:
    when:
      visible: ".*(AI hỗ trợ học tập).*"
    commands:
      - tapOn: ".*(Tiếp tục).*"
- extendedWaitUntil:
    visible:
      id: "exercise_close_button"
    timeout: 40000
- takeScreenshot: ../artifacts/HW-14_15-resumed

# --- Hoàn thành bằng exercise handler chung (không giả định loại câu hỏi - xem helper) ---
- runFlow: ../helpers/answer-current-exercise-generic.yaml

# --- Màn kết quả ---
- extendedWaitUntil:
    visible:
      text: ".*(Điểm số|Chính xác|Hoàn thành).*"
    timeout: 60000
- takeScreenshot: ../artifacts/HW-14_15-result

# --- Đóng kết quả -> về tab Bài tập ---
- tapOn:
    text: ".*(Hoàn thành).*"
    optional: true
- extendedWaitUntil:
    visible: ".*(Bài tập).*"
    timeout: 30000

# --- Xác nhận vẫn ĐÚNG assignment (card vẫn tồn tại, giờ đã hoàn thành) ---
- scrollUntilVisible:
    element:
      text: ".*${EXERCISE_NAME == null ? 'Read and choose' : EXERCISE_NAME}.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: ../artifacts/HW-14_15-card-completed
