# HW-27 — Đổi hồ sơ học sinh -> danh sách bài tập nạp lại theo hồ sơ mới
# Logic code: useEffect([profile]) -> scroll về đầu, setPage(1), fetch lại
# Cần: tài khoản phụ huynh có >= 2 hồ sơ con
# Kỳ vọng: sau khi chuyển hồ sơ, toast "Thay đổi tài khoản con thành công!",
#          tab Bài tập render lại theo dữ liệu hồ sơ mới (tiến độ / danh sách đổi)
# Tags: regression, data-dependent
appId: ${APP_ID}
tags:
  - regression
  - data-dependent
name: HW-27 Doi ho so con - reload danh sach bai tap
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml
- takeScreenshot: artifacts/HW-27-before-switch

# Mở chọn hồ sơ từ header của tab Bài tập
- tapOn:
    text: ".*(Chuyển profile).*"
    index: 0
- extendedWaitUntil:
    visible: ".*(Chuyển profile học tập).*"
    timeout: 15000
- tapOn:
    text: ".*(${PROFILE_NAME_B}).*"
# Nút xác nhận trong bottom sheet trùng chữ với link "Chuyển profile" ở header phía sau (header
# vẫn còn trong view tree dù bị sheet che) -> dùng match EXACT (không ".*...*" để tránh dính luôn
# tiêu đề sheet "Chuyển profile học tập") + index 1 mới trúng đúng nút xác nhận (index 0 là
# header, đã verify bằng debug screenshot - trước đây tap nhầm header nên sheet không đóng/không
# đổi hồ sơ, chỉ "pass" nhờ assert dưới có nhánh OR luôn đúng bất kể có đổi hồ sơ hay không).
- tapOn:
    text: "Chuyển profile"
    index: 1

- extendedWaitUntil:
    visible:
      text: ".*(Thay đổi tài khoản con thành công!).*"
    timeout: 40000
- assertVisible: ".*(${PROFILE_NAME_B}).*"
- extendedWaitUntil:
    visible:
      text: ".*(Bài tập về nhà|Bài tập nâng cao|Bạn không có bài tập nào đang chờ.).*"
    timeout: 15000
- takeScreenshot: artifacts/HW-27-after-switch
