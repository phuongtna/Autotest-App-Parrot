# HW-02 — Mở bottom sheet filter "Xem bài tập theo"
# Kỳ vọng: sheet hiện tiêu đề, đúng 2 lựa chọn, nút "Xem"
# Tags: smoke
appId: ${APP_ID}
tags:
  - smoke
name: HW-02 Filter sheet - mo va hien du lua chon
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

# Nhãn nút filter là giá trị đang chọn (thay đổi theo state) -> không hardcode text
# được, nhưng cả 2 giá trị có thể có đều kết thúc bằng "gần nhất" nên match theo đó.
#
# LƯU Ý: các testID `homework-filter-*` trong code KHÔNG lộ ra thành Android
# resource-id (đã kiểm tra bằng `uiautomator dump`: toàn app chỉ có duy nhất
# resource-id `action_bar_root`, không hề có bất kỳ testID nào khác) -> selector
# `id:` của Maestro luôn FAILED trên Android. Đây là vấn đề ở phía app (RN testID
# không được expose làm accessibility resource-id trên Android), không phải do
# thiếu dữ liệu. Cùng lỗi này còn ảnh hưởng HW-03, HW-04, HW-26, RP-12, RP-25 và
# helpers/open-exercise.yaml — cần dev kiểm tra lại cấu hình testID cho Android.
- tapOn:
    text: ".*gần nhất.*"

- extendedWaitUntil:
    visible: ".*(Xem bài tập theo).*"
    timeout: 10000
- assertVisible:
    text: ".*(2 tuần gần nhất).*"
- assertVisible:
    text: ".*(1 tháng gần nhất).*"
- assertVisible:
    text: "Xem"

- takeScreenshot: artifacts/HW-02-filter-sheet
