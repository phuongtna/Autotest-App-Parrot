# HW-04 — Mở sheet filter, chọn option khác nhưng ĐÓNG sheet mà không bấm "Xem"
# Kỳ vọng: lựa chọn KHÔNG được áp dụng, nhãn filter giữ nguyên giá trị cũ
#          (code: rangeTimeTemp chỉ commit vào rangeTimeSelected khi bấm "Xem")
# Tags: regression, negative
appId: ${APP_ID}
tags:
  - regression
  - negative
name: HW-04 Filter - dong sheet khong ap dung lua chon
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

# Ghi nhớ: mặc định khi vào tab là "2 tuần gần nhất"
- assertVisible: ".*(2 tuần gần nhất).*"

# LƯU Ý: testID `homework-filter-*` không lộ ra thành Android resource-id (xem
# ghi chú trong HW-02-filter-sheet-open.yaml) -> dùng selector text thay cho id.
- tapOn:
    text: ".*gần nhất.*"
- extendedWaitUntil:
    visible: ".*(Xem bài tập theo).*"
    timeout: 10000

# Chọn option khác nhưng KHÔNG bấm "Xem" -> đóng sheet bằng swipe xuống
- tapOn:
    text: ".*(1 tháng gần nhất).*"
- swipe:
    from:
      text: ".*(Xem bài tập theo).*"
    direction: DOWN
- extendedWaitUntil:
    notVisible: ".*(Xem bài tập theo).*"
    timeout: 10000

# Lựa chọn cũ PHẢI được giữ nguyên (không áp dụng lựa chọn tạm)
- assertVisible: ".*(2 tuần gần nhất).*"
- assertNotVisible: ".*(1 tháng gần nhất).*"

- takeScreenshot: artifacts/HW-04-filter-dismiss
