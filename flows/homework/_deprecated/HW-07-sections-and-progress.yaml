# HW-07 — Các nhóm section + thanh tiến độ tổng
# Kỳ vọng: hiện đúng các nhóm có dữ liệu:
#   - "Bài tập về nhà"    (level != ADVANCED)
#   - "Bài tập nâng cao"  (level == ADVANCED)
#   - "Kiến thức trong bài" (unit gợi ý, dedupe theo unit_id)
# Thứ tự PHẢI là: về nhà -> nâng cao -> kiến thức trong bài
# Tags: regression, data-dependent
appId: ${APP_ID}
tags:
  - regression
  - data-dependent
name: HW-07 Section groups + tien do tong
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

- assertVisible: ".*(Bài tập về nhà).*"

# Nhóm nâng cao có thể không có dữ liệu -> scroll tìm, ghi nhận nếu thiếu
- scrollUntilVisible:
    element:
      text: ".*(Bài tập nâng cao).*"
    direction: DOWN
    timeout: 60000
    speed: 100
    optional: true

- scrollUntilVisible:
    element:
      text: ".*(Kiến thức trong bài).*"
    direction: DOWN
    timeout: 60000
    speed: 100
    optional: true

- takeScreenshot: artifacts/HW-07-sections
