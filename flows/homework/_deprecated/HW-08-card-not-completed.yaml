# HW-08 — Card bài CHƯA hoàn thành
# Kỳ vọng trên card:
#   - dòng "Hạn nộp" + ngày DD/MM
#   - thanh tiến độ câu đã trả lời x / tổng
#   - nút "Làm bài" (bài thường) HOẶC "Tiếp tục" (đang làm dở) HOẶC "Chinh phục" (nâng cao)
#   - KHÔNG có block điểm / "Xem bài đã làm"
# Tags: regression, data-dependent
appId: ${APP_ID}
tags:
  - regression
  - data-dependent
name: HW-08 Card bai chua hoan thanh
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

- scrollUntilVisible:
    element:
      text: ".*(Hạn nộp).*"
    direction: DOWN
    timeout: 20000

- assertVisible: ".*(Hạn nộp).*"
- assertVisible:
    text: ".*(Làm bài|Tiếp tục|Chinh phục).*"

- takeScreenshot: artifacts/HW-08-card-not-completed
