# HW-09 — Bài quá hạn hiển thị nhãn "Quá hạn" (chữ đỏ) cạnh ngày hạn nộp
# Cần: tài khoản có ít nhất 1 bài due_date < hôm nay và chưa hoàn thành
# Kỳ vọng: thấy "(Quá hạn)" — code render uppercase từ key OVERDUE
# Tags: regression, data-dependent
appId: ${APP_ID}
tags:
  - regression
  - data-dependent
name: HW-09 Card qua han - nhan Qua han
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

- scrollUntilVisible:
    element:
      text: ".*QUÁ HẠN.*"
    direction: DOWN
    timeout: 25000

- takeScreenshot: artifacts/HW-09-overdue
