# HW-11 — Card bài ĐÃ hoàn thành
# Kỳ vọng:
#   - banner điểm (ảnh nền đổi theo mốc <7 / 7-9 / >=9) + chữ "Điểm" + số điểm
#   - dòng "Điểm <n>"
#   - link "Xem bài đã làm"
#   - nút "Làm lại" (variant outline2)
#   - KHÔNG có dòng "Hạn nộp" trên card này
# Tags: regression, data-dependent
appId: ${APP_ID}
tags:
  - regression
  - data-dependent
name: HW-11 Card bai da hoan thanh
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

- scrollUntilVisible:
    element:
      text: ".*(Xem bài đã làm).*"
    direction: DOWN
    timeout: 25000

- assertVisible: ".*(Xem bài đã làm).*"
- assertVisible: ".*(Làm lại).*"
- assertVisible:
    text: "Điểm.*"

- takeScreenshot: artifacts/HW-11-card-completed
