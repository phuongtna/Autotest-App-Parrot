# HW-14 — Luồng LÀM BÀI đầy đủ: từ card -> làm hết câu -> màn kết quả
# Kỳ vọng:
#   - vào màn làm bài: header X + tên bài + thanh tiến độ
#   - trả lời từng câu, bấm "Kiểm tra" -> "Tiếp theo"
#   - câu cuối -> toast "Bạn đã hoàn thành bài tập!" -> màn kết quả (Điểm số / Chính xác)
#   - từ kết quả bấm "Hoàn thành" -> quay lại tab Bài tập
# Lưu ý: bài có nhiều dạng câu (chọn đáp án, điền từ, nói). Flow này bấm option đầu tiên
#        nếu có; QA cần đối chiếu tay với dạng câu speak/record (xem TEST-CASES.md HW-14b).
# Tags: regression
appId: ${APP_ID}
tags:
  - writes
  - regression
name: HW-14 Lam bai - luong day du den ket qua
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

- scrollUntilVisible:
    element:
      text: ".*(Làm bài|Tiếp tục).*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ".*(Làm bài|Tiếp tục).*"
    index: 0

# Consent nếu chưa đồng ý
- runFlow:
    when:
      visible: ".*(AI hỗ trợ học tập).*"
    commands:
      - tapOn: ".*(Tiếp tục).*"

- extendedWaitUntil:
    visible:
      text: ".*(Kiểm tra|Tiếp theo|Nhập câu trả lời).*"
    timeout: 40000
- takeScreenshot: artifacts/HW-14-q1

# Lặp qua tối đa 20 câu: chọn đáp án (nếu là dạng chọn) -> Kiểm tra -> Tiếp theo
- repeat:
    times: 20
    commands:
      # Dạng điền từ
      - runFlow:
          when:
            visible: ".*(Nhập câu trả lời).*"
          commands:
            - tapOn: ".*(Nhập câu trả lời).*"
            - inputText: "test"
            - hideKeyboard
      # Bấm Kiểm tra nếu đang enable
      - tapOn:
          text: ".*(Kiểm tra).*"
          optional: true
      - tapOn:
          text: ".*(Tiếp theo).*"
          optional: true
      - tapOn:
          text: ".*(Hoàn thành).*"
          optional: true

# Màn kết quả
- extendedWaitUntil:
    visible:
      text: ".*(Điểm số|Chính xác|Hoàn thành).*"
    timeout: 40000
- takeScreenshot: artifacts/HW-14-result

# Đóng kết quả -> về tab Bài tập
- tapOn:
    text: ".*(Hoàn thành).*"
    optional: true
- extendedWaitUntil:
    visible: ".*(Bài tập).*"
    timeout: 30000
