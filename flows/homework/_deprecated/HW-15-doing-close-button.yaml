# HW-15 — Nút X (đóng) trên màn làm bài
# Kỳ vọng: bấm X -> router.back() -> quay lại tab Bài tập.
#          Bài đang làm dở PHẢI đổi nút thành "Tiếp tục" khi refresh lại tab.
# Tags: regression
appId: ${APP_ID}
tags:
  - writes
  - regression
name: HW-15 Man lam bai - nut dong X
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

- scrollUntilVisible:
    element:
      text: ".*(Làm bài|Tiếp tục).*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ".*(Làm bài|Tiếp tục).*"
    index: 0
- runFlow:
    when:
      visible: ".*(AI hỗ trợ học tập).*"
    commands:
      - tapOn: ".*(Tiếp tục).*"

- extendedWaitUntil:
    visible:
      text: ".*(Kiểm tra|Tiếp theo|Nhập câu trả lời).*"
    timeout: 40000

# Bấm nút X ở góc trên trái header
- tapOn:
    point: 8%, 8%

- extendedWaitUntil:
    visible: ".*(Bài tập).*"
    timeout: 20000

# Refresh để state doing_answer_id được nạp lại
- swipe:
    start: 50%, 35%
    end: 50%, 85%
    duration: 600
- extendedWaitUntil:
    visible:
      text: ".*(Bài tập về nhà|Bài tập nâng cao).*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*(Tiếp tục).*"
    direction: DOWN
    timeout: 20000

- takeScreenshot: artifacts/HW-15-close-resume
