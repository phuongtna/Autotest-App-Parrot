# HW-19 — Lịch sử hội thoại của bài role-play đã hoàn thành
# Kỳ vọng: từ card role-play đã xong bấm "Xem bài đã làm" -> mở lịch sử role-play
#          (route /dashboard/exercise/role-play/history) chứ KHÔNG phải lịch sử exam thường
# Tags: regression, data-dependent
appId: ${APP_ID}
tags:
  - regression
  - data-dependent
name: HW-19 Role-play - lich su hoi thoai
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

- scrollUntilVisible:
    element:
      text: ".*Trò chuyện cùng Parrot.*"
    direction: DOWN
    timeout: 25000
- tapOn:
    text: ".*(Xem bài đã làm).*"
    index: 0

- extendedWaitUntil:
    visible:
      text: ".*(Lịch sử hội thoại|Xem nhận xét|Xem lại cuộc hội thoại|Trò chuyện lại).*"
    timeout: 30000
- takeScreenshot: artifacts/HW-19-roleplay-history
