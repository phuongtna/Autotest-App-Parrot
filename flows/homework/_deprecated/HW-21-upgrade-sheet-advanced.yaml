# HW-21 — Tài khoản FREE bấm "Chinh phục" ở bài NÂNG CAO -> API trả 403
# Kỳ vọng (iOS): mở bottom sheet nâng cấp với
#   - title "Nâng cấp để con thực hành nâng cao"
#   - note  "Bài tập nâng cao dành cho tài khoản PRO"
# Kỳ vọng (Android, khi ANDROID_PAYMENT_ENABLED=true): sheet Google Play với reason exercise_advanced
# Kỳ vọng (Android, payment tắt): toast "Không thể bắt đầu làm bài"
# Tags: pro-only, negative
appId: ${APP_ID}
tags:
  - pro-only
  - negative
name: HW-21 Free account - bai nang cao 403 -> sheet nang cap
---
- runFlow: ../helpers/launch-fresh.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

- scrollUntilVisible:
    element:
      text: ".*(Bài tập nâng cao).*"
    direction: DOWN
    timeout: 25000
- scrollUntilVisible:
    element:
      text: ".*(Chinh phục).*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ".*(Chinh phục).*"
    index: 0
- runFlow:
    when:
      visible: ".*(AI hỗ trợ học tập).*"
    commands:
      - tapOn: ".*(Tiếp tục).*"

- extendedWaitUntil:
    visible:
      text: ".*(Nâng cấp để con thực hành nâng cao|Bài tập nâng cao dành cho tài khoản PRO|Nâng cấp tài khoản|Không thể bắt đầu làm bài).*"
    timeout: 30000
- takeScreenshot: artifacts/HW-21-upgrade-advanced
