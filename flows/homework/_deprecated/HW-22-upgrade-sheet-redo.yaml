# HW-22 — Tài khoản FREE bấm "Làm lại" ở bài ĐÃ hoàn thành -> API trả 403
# Kỳ vọng (iOS): sheet nâng cấp với
#   - title "Nâng cấp để con tiếp tục học không giới hạn"
#   - note  "Làm lại bài tập dành cho tài khoản PRO"
# Đây là nhánh khác HW-21 (is_completed === true) — hai message KHÔNG được lẫn nhau.
# Tags: pro-only, negative
appId: ${APP_ID}
tags:
  - pro-only
  - negative
name: HW-22 Free account - Lam lai 403 -> sheet nang cap
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-homework.yaml

- scrollUntilVisible:
    element:
      text: ".*(Làm lại).*"
    direction: DOWN
    timeout: 25000
- tapOn:
    text: ".*(Làm lại).*"
    index: 0
- runFlow:
    when:
      visible: ".*(AI hỗ trợ học tập).*"
    commands:
      - tapOn: ".*(Tiếp tục).*"

- extendedWaitUntil:
    visible:
      text: ".*(Nâng cấp để con tiếp tục học không giới hạn|Làm lại bài tập dành cho tài khoản PRO|Nâng cấp tài khoản|Không thể bắt đầu làm bài).*"
    timeout: 30000
- takeScreenshot: artifacts/HW-22-upgrade-redo

# Message PHẢI KHÔNG phải message của bài nâng cao
- assertNotVisible: ".*(Bài tập nâng cao dành cho tài khoản PRO).*"
