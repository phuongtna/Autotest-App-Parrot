# RP-11 — Khối "Chuyên cần" — đủ 4 thẻ
# Kỳ vọng:
#   - "Bài tập về nhà"  : vòng tròn <đã nộp>/<được giao>
#   - "Bài đã học"      : vòng tròn số bài
#   - "Nỗ lực làm lại"  : "<n> lần"
#   - "Thời gian học"   : tổng thời gian + dòng trung bình/ngày
#   - nếu summary null -> "Chưa có dữ liệu"
# Tags: regression, data-dependent
appId: ${APP_ID}
tags:
  - regression
  - data-dependent
name: RP-11 Khoi Chuyen can - 4 the
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-report.yaml
- tapOn:
    text: ".*(Báo cáo học tập).*"
    index: 0

- scrollUntilVisible:
    element:
      text: ".*(Chuyên cần).*"
    direction: DOWN
    timeout: 30000

- runFlow:
    when:
      notVisible: "Chưa có dữ liệu"
    commands:
      - assertVisible: ".*(Bài tập về nhà).*"
      - assertVisible: ".*(Bài đã học).*"
      - scrollUntilVisible:
          element:
            text: ".*(Nỗ lực làm lại).*"
          direction: DOWN
          timeout: 20000
      - assertVisible: ".*(Thời gian học).*"

- takeScreenshot: artifacts/RP-11-attendance
