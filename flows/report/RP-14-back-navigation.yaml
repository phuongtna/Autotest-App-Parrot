# RP-14 — Quay lại từ màn Báo cáo học tập
# Kỳ vọng: bấm nút back trên header -> về tab Báo cáo, tab bar hiện lại,
#          state của tab Báo cáo không bị mất (menu vẫn đủ)
# Tags: smoke, regression
appId: ${APP_ID}
tags:
  - smoke
  - regression
name: RP-14 Back tu man Bao cao hoc tap
---
- runFlow: ../helpers/launch-keep-session.yaml
- runFlow:
    file: ../helpers/login.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- runFlow: ../helpers/open-tab-report.yaml
- tapOn:
    text: ".*(Báo cáo học tập).*"
    index: 0
- extendedWaitUntil:
    visible:
      text: ".*(Tuần trước|Tuần này).*"
    timeout: 30000

# Nút back góc trên trái
- tapOn:
    point: 6%, 8%

- extendedWaitUntil:
    visible: ".*(Thông tin các con).*"
    timeout: 20000
- assertVisible: ".*(Quản lý tài khoản).*"
- assertVisible: ".*(Bài tập).*"

- takeScreenshot: artifacts/RP-14-back
