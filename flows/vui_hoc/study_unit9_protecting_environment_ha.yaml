# Biến thể của study_unit9_protecting_environment.yaml nhưng học bằng profile "Ha" thay vì "Ngoc".
# Lý do tách file riêng thay vì tham số hoá: subflow launch_app.yaml luôn "clearState" trước khi mở
# app, nên sau khi đăng nhập LUÔN mặc định là profile Ngoc (profile đầu tiên) - phải chủ động
# "Chuyển profile" sang Ha ngay sau khi vào "Vui học", trước khi kiểm tra Khối/Unit.
#
# Step: giống study_unit9_protecting_environment.yaml, chỉ thêm bước đổi sang profile Ha ở đầu.
#
# Chạy: maestro test flows/vui_hoc/study_unit9_protecting_environment_ha.yaml -e APP_ID=com.inet.parrotedu
appId: ${APP_ID}
---
- runFlow: ../subflows/launch_app.yaml
- runScript: ../../test_data/datatest.js

# Đăng nhập
- tapOn: "Nhập số điện thoại"
- inputText: ${output.PHONE}
- tapOn: "Đăng nhập"
- extendedWaitUntil:
    visible:
      text: "Xác thực OTP"
    timeout: 10000
- tapOn:
    below: "Đổi số điện thoại"
    above: "Xác nhận"
- inputText: ${output.OTP}
- tapOn: "Xác nhận"
- extendedWaitUntil:
    visible:
      text: "Vui học"
    timeout: 15000

# Vào tab "Vui học" (mặc định đang học bằng profile Ngoc sau đăng nhập - profile đầu tiên sau clearState)
- tapOn: "Vui học"

# Đổi sang profile Ha - dùng "notVisible: Ha" (không phải "visible: Ngoc") để không phụ thuộc chữ
# hiển thị của profile hiện tại, chỉ cần đảm bảo đích đến là Ha.
- runFlow:
    when:
      notVisible: "Ha"
    commands:
      - tapOn: "Chuyển profile"
      - extendedWaitUntil:
          visible:
            text: "Thay đổi tài khoản con thành công!"
          timeout: 10000
      - assertVisible: "Ha"

# TH1/TH2: kiểm tra Khối hiện tại, nếu chưa phải Khối 10 thì đổi sang Khối 10.
# Dùng "leftOf: Chuyển profile" để mở dropdown chọn khối vì text hiện tại (Khối X) thay đổi tùy trạng thái.
- runFlow:
    when:
      notVisible: "Khối 10"
    commands:
      - tapOn:
          leftOf: "Chuyển profile"
      - extendedWaitUntil:
          visible:
            text: "Chọn khối"
          timeout: 5000
      - tapOn: "Khối 10"

- extendedWaitUntil:
    visible:
      text: "Khối 10"
    timeout: 10000

# TH1/TH2: kiểm tra Unit đang hiển thị ở màn chính, nếu không phải Unit 9 thì vào "Tất cả units" và scroll tìm
- runFlow:
    when:
      notVisible: "Unit 9: Protecting the enviroment"
    commands:
      - tapOn: "Tất cả units"
      - extendedWaitUntil:
          visible:
            text: "Danh sách Units - Khối 10"
          timeout: 10000
      - scrollUntilVisible:
          element:
            text: "Unit 9: Protecting the enviroment"
          direction: DOWN
          timeout: 20000
      # scroll thêm 1 bước để chắc chắn cả nút "Chinh phục"/"Ôn tập" của Unit 9 cũng vào khung hình
      # (card Unit 9 khá cao - ảnh + tiêu đề + mô tả + nút - nên chỉ scroll tới tiêu đề là chưa đủ)
      - scrollUntilVisible:
          element:
            below: "Unit 9: Protecting the enviroment"
            text: "Chinh phục|Ôn tập"
          direction: DOWN
          timeout: 20000

# TH1/TH2: quan sát nút của Unit 9 - nếu đang "Chinh phục" (chưa hoàn thành) thì bấm Chinh phục,
# nếu đã hoàn thành hết (nút đổi thành "Ôn tập") thì bấm Ôn tập.
- runFlow:
    when:
      visible:
        below: "Unit 9: Protecting the enviroment"
        text: "Chinh phục"
    commands:
      - tapOn:
          below: "Unit 9: Protecting the enviroment"
          text: "Chinh phục"
- runFlow:
    when:
      visible:
        below: "Unit 9: Protecting the enviroment"
        text: "Ôn tập"
    commands:
      - tapOn:
          below: "Unit 9: Protecting the enviroment"
          text: "Ôn tập"

- takeScreenshot: study_unit9_result_ha
